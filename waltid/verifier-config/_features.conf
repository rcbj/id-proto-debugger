// The plain OpenID4VP 1.0 verifier, plus dev-mode.
//
// dev-mode is an OptionalFeature with `default = false` in
// OSSVerifier2FeatureCatalog, so naming it here is what makes dev-mode.conf get
// read at all — without it the file sits in the config directory doing nothing
// and DevModeConfig's own default (enableDidWebResolverHttps = true) applies.
// This whole test network speaks plain HTTP, which is the one thing that default
// forbids.
//
// transaction-data-profiles is `default = true`, so it is already on and does not
// belong in this list; transaction-data-profiles.conf is read either way.
enabledFeatures = ["dev-mode"]
disabledFeatures = []
