// The identity of this verifier, and the addresses it hands to a wallet.
//
// clientId is the OID4VP Client Identifier. It carries NO prefix on purpose, so
// it is a pre-registered client (OID4VP section 5.10's fallback) — which is what
// our wallet's step 1 reports, and what the Key Binding JWT's `aud` must be.
// walt.id's own sample uses "verifier2"; the launcher can override it.
clientId: "${WALTID_VERIFIER_CLIENT_ID}"

clientMetadata: {
    client_name: "walt.id Verifier (interop test)"
}

// Where the wallet fetches the Request Object and POSTs the presentation. It MUST
// be the public address — the CORS proxy — because walt.id's services send no
// CORS headers of their own and a browser-based wallet cannot read a response
// without them. Every URL walt.id builds for the wallet starts here.
urlPrefix: "${WALTID_VERIFIER_BASE_URL}/verification-session"

// The scheme a native wallet registers, which is what a cross-device QR code
// carries. Our step 1 accepts exactly this shape pasted in.
urlHost: "openid4vp://authorize"

// The key this verifier signs Request Objects with when a session asks for
// signed_request. Generated fresh per run by generateWaltidVerifierKey() in
// common/common.sh and written in by renderWaltidConfig(), so no key material is
// committed — the same rule the issuer's key and the SAML SP pair follow.
//
// UNQUOTED on purpose. This is NOT the shape the issuer's key takes:
// OSSVerifier2ServiceConfig declares `key: JsonObject?`, so the value has to be
// an object, while the issuer's OSSIssuer2ServiceConfig declares ciTokenKey as a
// String and therefore needs the triple quotes. Quote this one and Hoplite fails
// to decode the file, the service dies before it listens, and the only visible
// symptom is a 502 from the CORS proxy in front of it. HOCON is a superset of
// JSON, so the generated JSON object parses here as-is.
key: ${WALTID_VERIFIER_KEY}
