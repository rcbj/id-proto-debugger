// The walt.id verifier listens here, behind the CORS proxy (waltid/cors-proxy.js)
// that serves 7003. The BROWSER never talks to this port: it talks to the proxy,
// and the verifier's urlPrefix names the proxy so that every URL walt.id hands a
// wallet — the request_uri it fetches, the response_uri it POSTs to — is one the
// browser can actually use.
//
// 7004 is walt.id's own default for verifier-api2; it is kept so the container's
// EXPOSE and this file agree.
webHost = "0.0.0.0"
webPort = "7004"
