// walt.id's issuer-api2 does not authenticate End-Users itself: its
// authorization endpoint always redirects to an external OpenID Provider and
// mints its own authorization code once that provider comes back with an
// id_token. Here that provider is the SAME Keycloak realm the rest of this test
// suite uses, so the walt.id run exercises a genuine three-party issuance —
// our wallet, walt.id as Credential Issuer and authorization server, and
// Keycloak as the identity provider.
//
// The URLs must be reachable BOTH by the browser (the authorize redirect) and
// by the walt.id container (the back-channel token call), which is why the
// launcher supplies them rather than this file hard-coding a host.
name = "keycloak"
authorizeUrl = "${WALTID_KEYCLOAK_AUTHORIZE_URL}"
accessTokenUrl = "${WALTID_KEYCLOAK_TOKEN_URL}"
clientId = "${WALTID_KEYCLOAK_CLIENT_ID}"
clientSecret = "${WALTID_KEYCLOAK_CLIENT_SECRET}"
defaultScopes = ["openid", "profile"]

// The issuer_state belongs to walt.id's own session, not to Keycloak's.
forwardIssuerStateToAuthorizationServer = false
