// The identity of this issuer, and the key it signs its OWN access tokens with.
//
// baseUrl is what every URL in the published metadata is built from, so it has
// to be the address the BROWSER uses — waltid-issuer:7005 on the compose
// network, localhost:7005 when the browser runs on the host. The launcher sets
// it; see generateWaltidIssuerKey() in common/common.sh.
//
// Both values come from the environment on purpose: no key material is
// committed to this repository, the same rule the SAML SP key pair follows.
baseUrl = "${WALTID_BASE_URL}"

// A JSON string of the form {"type":"jwk","jwk":{…}} — the shape walt.id's own
// configuration uses for this field, and it writes it in TRIPLE quotes for the
// obvious reason: the value is full of double quotes, and inside ordinary quotes
// the first one would end the string and leave the rest as a syntax error.
ciTokenKey = """${WALTID_CI_TOKEN_KEY}"""
