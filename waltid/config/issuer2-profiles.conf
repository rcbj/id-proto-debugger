// The one issuance profile this deployment offers, and the key it signs
// credentials with.
//
// The key is assembled leaf by leaf from the environment, which keeps a private
// key out of this repository. The launcher (generateWaltidIssuerKey in
// common/common.sh) generates a fresh P-256 key per run and exports
// WALTID_KEY_D / _X / _Y and the matching did:jwk.
//
// Environment references are QUOTED — "${VAR}" — exactly as walt.id's own
// configuration files write them. That is string interpolation performed by the
// config loader, not HOCON's own ${VAR} substitution: an unquoted reference is
// resolved (or not) by the HOCON parser instead, and when it is not, the service
// dies at startup with nothing listening. An unquoted ${defaultIssuerKey} below
// IS a HOCON reference — to another value in this file, not to the environment —
// which is how upstream writes it too.
defaultIssuerKey = {
  type = "jwk"
  jwk = {
    kty = "EC"
    crv = "P-256"
    d = "${WALTID_KEY_D}"
    x = "${WALTID_KEY_X}"
    y = "${WALTID_KEY_Y}"
  }
}

// walt.id signs with a did:jwk, which is the public half of that same key
// encoded into the identifier — so the credential's `iss` carries its own
// verification key. Our step 3 resolves that without a network call.
defaultIssuerDid = "${WALTID_ISSUER_DID}"

profiles = {
  identityCredentialSdJwt = {
    name = "Identity Credential"
    credentialConfigurationId = "identity_credential"
    issuerKey = ${defaultIssuerKey}
    issuerDid = ${defaultIssuerDid}
    credentialData = {
      "given_name" = "Diploma"
      "family_name" = "Student"
      "email" = "diploma.student@iyasec.io"
      "phone_number" = "+1-202-555-0101"
      "address" = {
        "street_address" = "123 Main St"
        "locality" = "Anytown"
        "region" = "Anystate"
        "country" = "US"
      }
      "birthdate" = "1940-01-01"
      "is_over_18" = true
      "is_over_21" = true
      "is_over_65" = true
    }
    mapping = {
      id = "<uuid>"
      iat = "<timestamp-seconds>"
      nbf = "<timestamp-seconds>"
      exp = "<timestamp-in-seconds:365d>"
    }
    // Several claims made selectively disclosable rather than walt.id's default
    // of one: the point of step 3 is the Disclosure table, and a credential with
    // a single Disclosure demonstrates very little of it.
    selectiveDisclosure = {
      "fields" = {
        "given_name" = { "sd" = true }
        "birthdate" = { "sd" = true }
        "email" = { "sd" = true }
        "phone_number" = { "sd" = true }
        "address" = { "sd" = true }
        "family_name" = { "sd" = false }
      }
      "decoyMode" = "NONE"
      "decoys" = 0
    }
    // Whoever signs in at Keycloak becomes the subject of the credential: these
    // claims are copied out of the id_token walt.id got back from it. That is
    // what makes the run a real end-to-end issuance rather than a fixed
    // document with a signature on it.
    idTokenClaimsMapping = {
      "$.given_name" = "$.given_name"
      "$.family_name" = "$.family_name"
    }
  }

  // The same End-User facts as identityCredentialSdJwt, issued as a W3C VC
  // secured as a JWT. Modelled on walt.id's own jwt_vc_json profiles, which is
  // why the shape differs from the SD-JWT one above:
  //
  //   * credentialData IS the W3C credential — @context, type, credentialSubject
  //     and the issuer/date members — rather than a flat claim set, because that
  //     is the document that gets signed;
  //   * there is no selectiveDisclosure block, and there cannot be one: this
  //     format has no Disclosures, so every claim below is sent whenever the
  //     credential is presented;
  //   * the placeholder strings are replaced at issuance time by the `mapping`
  //     entries underneath, which is walt.id's convention (their shipped
  //     profiles write the same "THIS WILL BE REPLACED..." markers).
  //
  // HOLDER BINDING IS DIFFERENT HERE, and it is the thing to watch. walt.id
  // binds a jwt_vc_json credential by SUBJECT DID — mapping.credentialSubject.id
  // = "<subjectDid>" — where its SD-JWT VC path uses cnf.jwk. Our own mock
  // issuer binds jwt_vc_json with cnf.jwk, and our verifier checks the
  // presentation signature against exactly that. So a credential issued from
  // HERE will not carry a cnf.jwk, and presenting it to our mock verifier will
  // fail the holder-binding check until both sides also understand the DID
  // route. That is a real interoperability finding rather than a
  // misconfiguration, and it is the reason for running this at all.
  identityCredentialJwtVcJson = {
    name = "Identity Credential (JWT VC)"
    credentialConfigurationId = "IdentityCredential_jwt_vc_json"
    issuerKey = ${defaultIssuerKey}
    issuerDid = ${defaultIssuerDid}
    credentialData = {
      "@context" = ["https://www.w3.org/2018/credentials/v1"]
      "type" = ["VerifiableCredential", "IdentityCredential"]
      "credentialSubject" = {
        "id" = "THIS WILL BE REPLACED WITH DYNAMIC DATA FUNCTION"
        "given_name" = "Diploma"
        "family_name" = "Student"
        "email" = "diploma.student@iyasec.io"
        "phone_number" = "+1-202-555-0101"
        "birthdate" = "1940-01-01"
        "is_over_18" = true
        "is_over_21" = true
        "is_over_65" = true
        "address" = {
          "street_address" = "123 Main St"
          "locality" = "Anytown"
          "region" = "Anystate"
          "country" = "US"
        }
      }
      "id" = "THIS WILL BE REPLACED WITH DYNAMIC DATA FUNCTION"
      "issuer" = {
        "id" = "THIS WILL BE REPLACED WITH DYNAMIC DATA FUNCTION"
        "name" = "walt.id Issuer (interop test)"
      }
      "issuanceDate" = "THIS WILL BE REPLACED WITH DYNAMIC DATA FUNCTION"
      "expirationDate" = "THIS WILL BE REPLACED WITH DYNAMIC DATA FUNCTION"
    }
    mapping = {
      "id" = "<uuid>"
      "issuer" = {
        "id" = "<issuerDid>"
      }
      "credentialSubject" = {
        "id" = "<subjectDid>"
      }
      "issuanceDate" = "<timestamp>"
      "expirationDate" = "<timestamp-in:365d>"
    }
    // Whoever signs in at Keycloak becomes the subject, as in the SD-JWT profile.
    // The target paths are rooted at credentialSubject because that is where a
    // W3C VC keeps its claims — the left side is the id_token claim, the right
    // side the path in credentialData above.
    idTokenClaimsMapping = {
      "$.given_name" = "$.credentialSubject.given_name"
      "$.family_name" = "$.credentialSubject.family_name"
    }
  }
}
