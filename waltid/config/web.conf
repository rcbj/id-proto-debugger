// The walt.id issuer listens here, behind the CORS proxy (waltid/cors-proxy.js)
// that serves 7005. The BROWSER never talks to this port: it talks to the proxy,
// and the issuer's baseUrl names the proxy so that every URL walt.id publishes
// is one the browser can actually use.
webHost = "0.0.0.0"
webPort = "7006"
