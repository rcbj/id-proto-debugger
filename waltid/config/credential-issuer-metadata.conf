// What this issuer advertises at /.well-known/openid-credential-issuer/openid4vci.
//
// walt.id ships twenty credential configurations; this deployment keeps ONE —
// the same `identity_credential` / `dc+sd-jwt` configuration the mock issuer in
// sts/ offers. The point of running walt.id in this suite is to check our
// workflow against a real implementation of the same thing, and one
// configuration on both sides makes any difference a difference in the
// implementation rather than in what was asked for.
issuerDisplay = [
  {
    name = "walt.id Issuer (interop test)"
    locale = "en-US"
  }
]

credentialConfigurations = {
  "identity_credential" = {
    format = "dc+sd-jwt"
    scope = "identity_credential"
    // "vctBaseUrl" is walt.id's marker for "publish <baseUrl>/openid4vci/<id>
    // as the vct", which is what makes the type resolvable at
    // /.well-known/vct/<id>.
    vct = "vctBaseUrl"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["jwk"]
    proof_types_supported = {
      jwt = {
        proof_signing_alg_values_supported = ["ES256"]
      }
    }
  }

  // The SAME facts in the other format walt.id speaks: a W3C Verifiable
  // Credential secured as a JWT. Added so the interoperability suite can drive
  // BOTH formats against an implementation that is not ours — the SD-JWT VC
  // configuration above and this one differ only in format, so any difference
  // the suite finds is a difference in how the format is handled.
  //
  // The id follows walt.id's own convention, "<Type>_jwt_vc_json" (their shipped
  // config uses AlpsTourReservation_jwt_vc_json and friends). A W3C VC has no
  // vct: the credential_definition.type array is what identifies it, which is
  // why there is no vct member here.
  //
  // Note the binding methods. walt.id's own jwt_vc_json profiles bind the holder
  // by SUBJECT DID (mapping.credentialSubject.id = "<subjectDid>"), not by a
  // cnf.jwk the way its SD-JWT VC path does — see the profile in
  // issuer2-profiles.conf.
  "IdentityCredential_jwt_vc_json" = {
    format = "jwt_vc_json"
    scope = "identity_credential_jwt_vc_json"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["jwk", "did:key", "did:jwk"]
    proof_types_supported = {
      jwt = {
        proof_signing_alg_values_supported = ["ES256"]
      }
    }
    credential_definition = {
      type = ["VerifiableCredential", "IdentityCredential"]
    }
  }
}
