# Minimal Keycloak for running the Selenium suite against a deployed (or local)
# debugger site via remote-run-tests.sh.
#
# Dev mode (in-memory H2 — no Postgres needed for throwaway test data), admin
# keycloak/keycloak, HTTP bound to host port 8080 via host networking. The
# realm/clients are created at run time by common.sh configureKeycloak.
version: '2.4'
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: ["start-dev"]
    hostname: keycloak
    network_mode: "host"
    environment:
      KC_HTTP_PORT: "8080"
      # Both the modern (26+) and legacy bootstrap-admin vars, for compatibility.
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak
      KEYCLOAK_ADMIN: keycloak
      KEYCLOAK_ADMIN_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
  # WS-Trust STS (mock) for remote-run-tests.sh against a local dev site. The
  # host-run browser / local api reach it at http://localhost:8081/sts.
  sts:
    image: rcbj/sts
    hostname: sts
    network_mode: "host"
    environment:
      # Log level, chosen the same way as for api and client.
      - CONFIG_FILE=./env/local.js
      # Host networking: Keycloak is on the same loopback.
      #
      # Where the WALLET is, as a base URL the browser can use. This launcher runs
      # the suite against a site that is NOT on this host — https://test.idptools.com,
      # say — so the mock issuer's Credential Offer pages and the mock verifier's
      # request pages have to hand the End-User back THERE, not to the localhost:3000
      # they default to. remote-run-tests.sh exports it as the target base URL; left
      # unset it arrives empty and sts/server.js falls back to its own default, which
      # is right for a local dev site.
      - OID4VCI_WALLET_URL=${OID4VCI_WALLET_URL}
    build:
      context: .
      dockerfile: sts/Dockerfile
  # walt.id issuer-api2 — the real OpenID4VCI issuer the interop suite
  # (tests/sd_jwt_vc_waltid.js) runs against. Host networking, so the host-run
  # browser reaches it at localhost:7005 and it reaches Keycloak on the same
  # loopback. Its signing key comes from the environment
  # (generateWaltidIssuerKey in common/common.sh); no private key is committed.
  waltid-issuer-api:
    image: waltid/issuer-api2:0.23.0
    # No hostname: under host networking it resolves to nothing, and the
    # service's logger prints an UnknownHostException stack trace over it.
    network_mode: "host"
    volumes:
      # Rendered by renderWaltidConfig() (common/common.sh) with this run's
      # values — including its signing key — written in, so nothing here
      # depends on how walt.id's config loader expands ${...}.
      - ./waltid/generated-config:/waltid-issuer-api2/config:ro

  # CORS in front of the issuer. walt.id's services send no CORS headers of their
  # own — they install no CORS plugin, and walt.id's own stack fronts every one of
  # them for that reason — and a browser-based wallet cannot read a response
  # without them. This IS the address the wallet uses, and the address the
  # issuer's baseUrl names, because every URL walt.id publishes is built from it.
  # A stock node image runs it: waltid/cors-proxy.js has no dependencies.
  waltid-issuer:
    image: node:24-alpine
    command: ["node", "/waltid/cors-proxy.js"]
    network_mode: "host"
    environment:
      - WALTID_UPSTREAM=localhost:7006
      - WALTID_PROXY_PORT=7005
    volumes:
      - ./waltid/cors-proxy.js:/waltid/cors-proxy.js:ro
    healthcheck:
      # The whole chain: this proxy answering, and the issuer behind it serving
      # the metadata a wallet asks for first. The probe lives here rather than on
      # the issuer because that image is built with Jib and has no shell for
      # CMD-SHELL to run — a probe there can never pass, and compose then waits
      # forever on a service that is working perfectly.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:7005/.well-known/openid-credential-issuer/openid4vci',function(r){var b='';r.on('data',function(d){b+=d});r.on('end',function(){process.exit(r.statusCode===200&&b.indexOf('credential_issuer')!==-1?0:1)})}).on('error',function(){process.exit(1)})\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      waltid-issuer-api:
        condition: service_started

  # walt.id verifier-api2 — the independently written OpenID4VP 1.0 verifier the
  # presentation interoperability suite (tests/sd_jwt_vc_presentation_waltid.js)
  # runs against, beside the mock one the STS hosts. Same treatment as the issuer
  # above: host networking so the host-run browser reaches its proxy at
  # localhost:7003, and its request-signing key comes from the environment
  # (generateWaltidVerifierKey in common/common.sh).
  waltid-verifier-api:
    image: waltid/verifier-api2:0.23.0
    # No hostname, for the same reason as the issuer.
    network_mode: "host"
    volumes:
      # Rendered by renderWaltidConfig(). A SEPARATE directory from the issuer's:
      # walt.id reads whatever conf files are in the directory it is given, and the
      # two services must not be handed each other's.
      - ./waltid/generated-verifier-config:/waltid-verifier-api2/config:ro

  # CORS in front of the verifier, and the address its urlPrefix names — so every
  # URL it hands the wallet (the request_uri it fetches, the response_uri it POSTs
  # to) is one the browser can use.
  waltid-verifier:
    image: node:24-alpine
    command: ["node", "/waltid/cors-proxy.js"]
    network_mode: "host"
    environment:
      - WALTID_UPSTREAM=localhost:7004
      - WALTID_PROXY_PORT=7003
    volumes:
      - ./waltid/cors-proxy.js:/waltid/cors-proxy.js:ro
    healthcheck:
      # /livez is what walt.id's service-commons registers for every service. The
      # probe is on the proxy because the verifier image has no shell for CMD-SHELL
      # to run; this covers the whole chain.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:7003/livez',function(r){process.exit(r.statusCode<500?0:1)}).on('error',function(){process.exit(1)})\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      waltid-verifier-api:
        condition: service_started

  # WS-Federation IdP side-car (Keycloak 8.0.1 + the cloudtrust keycloak-wsfed
  # extension) for tests/wsfed_sso.js. The 26.x Keycloak above has no WS-Federation
  # support at all and the extension only targets 8.0.1, so this is a second IdP.
  #
  # Host networking, hence a WildFly port-offset of 2: HTTP lands on 8082, clear of
  # the 26.x Keycloak (8080) and the STS (8081). No hostname — under host networking
  # Docker adds no /etc/hosts entry for it, and Keycloak 8 resolves its own hostname
  # (see keycloak-wsfed/Dockerfile, which also takes AUTO_SERVER off the H2 URL for
  # that reason). configureKeycloakWsfed() provisions the realm, the relying-party
  # client and the user.
  keycloak-wsfed:
    container_name: keycloak-wsfed
    image: rcbj/keycloak-wsfed
    network_mode: "host"
    build:
      context: .
      dockerfile: keycloak-wsfed/Dockerfile
    command: ["-b", "0.0.0.0", "-Djboss.socket.binding.port-offset=2"]
    environment:
      KEYCLOAK_USER: keycloak
      KEYCLOAK_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/auth/realms/master || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 150s
