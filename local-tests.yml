# Compose format 2.4: docker-compose (v1) honors `depends_on: condition:
# service_healthy` only in 2.x files. In v3 that condition is silently ignored
# (start-order only), which lets Keycloak start before Postgres is accepting
# connections and crash with "Connection to localhost:5432 refused".
version: '2.4'
services:
  postgres:
    image: postgres:18
    # No `user:` needed and one would BREAK it: the official image's
    # entrypoint starts as root only to create and chown PGDATA on a fresh
    # volume, then drops to the `postgres` account with gosu before the
    # server starts. Pinning a user here skips the chown and initdb fails on
    # a directory it cannot write.
    hostname: postgres
    network_mode: "host" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
      # postgres:18 refuses to start on a data dir initialized by an older
      # major version. Initialize into a fresh subdirectory of the volume so
      # the upgrade starts cleanly (test data is disposable and recreated each
      # run); any legacy PG17 files at the volume root are ignored.
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: pg_isready
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 45s
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    # Already non-root: the Keycloak image declares USER 1000 itself.
    # DPoP (RFC 9449) is a PREVIEW feature in Keycloak 26 and is off unless it is
    # named here: without it the server ignores the DPoP header entirely, issues a
    # perfectly ordinary Bearer token, and advertises no
    # dpop_signing_alg_values_supported — so the OIDC DPoP jobs would fail with "the
    # token came back unbound", which reads as a client bug rather than as a server
    # that was never asked to support it. tests/oidc_flows.js checks that
    # advertisement before running an OIDC_DPOP=on job and says so by name.
    command: ["start-dev", "--features=dpop"]
    hostname: keycloak
    network_mode: "host"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: keycloak
      KEYCLOAK_ADMIN_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    # Probe the management port's /health/ready and require an "UP" status. Uses
    # bash /dev/tcp (no curl/wget in the Keycloak image). A well-formed HTTP/1.0
    # request (blank line terminates it; server closes the connection) — the
    # previous probe sent an incomplete request line and an inline '#' comment
    # (once the YAML lines joined) commented out the UP check, so it only tested
    # that the port was open.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 || exit 1; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q 'UP' <&3"]
      interval: 10s
      timeout: 10s
      retries: 20
      # First start of a freshly-pulled image on a fresh Postgres DB runs schema
      # creation and can take well over a minute, so allow a generous window.
      start_period: 150s
    depends_on:
      postgres:
        condition: service_healthy
  api:
    container_name: api
    hostname: api
    image: rcbj/api
    network_mode: "host"
    # `sts` is the address the KERBEROS pages hand to the api's relay — the KDC is
    # not HTTP, so the browser cannot reach it and the api resolves the name (see
    # client/src/env/local.js, which bakes it in as krb5KdcHostDefault). On the
    # bridge stack (docker-compose.yml) Docker's DNS answers it. HERE there is no
    # Docker DNS at all, because every service uses host networking, so the name
    # resolved to nothing and every AS-REQ came back EKRB5DNS, "Could not resolve
    # sts" — from a KDC the user can reach perfectly well from their own shell.
    # Under host networking 127.0.0.1 IS the host, which is where the mock STS's
    # KDC listens (88, TCP and UDP) along with its ticket-protected service
    # (8888), so this entry makes the one baked-in address work on both stacks.
    # Only the api needs it: it is the only process that resolves the KDC's name.
    extra_hosts:
      - "sts:127.0.0.1"
      # A SECOND NAME FOR THE SAME SERVICE, AND THE POINT IS THAT THE
      # CERTIFICATE DOES NOT CARRY IT.
      #
      # tests/api_ldap.js binds the mock's LDAPS socket under this name to
      # prove that this service still VERIFIES certificates. It cannot prove
      # that with an untrusted certificate any more: the entrypoint above
      # fetches the mock's own self-signed certificate into NODE_EXTRA_CA_CERTS
      # on every start, so the anchor is deliberately there and the connection
      # deliberately succeeds. What a truststore entry does NOT do is switch
      # off hostname verification, so a name outside the certificate's
      # subjectAltName is the one refusal left that only a verifying client can
      # produce — which is what keeps every `rejectUnauthorized: false` in that
      # file from being a decoration.
      #
      # The mock generates the certificate with SANs localhost, sts, sts-mock,
      # sts.example.com and 127.0.0.1, so this name must stay OUT of that list.
      # docker-compose-run-tests.yml provides the same name as a network alias
      # on the `sts` service, because there is no Docker DNS on this stack and
      # no /etc/hosts to edit on that one.
      - "sts-not-in-the-certificate:127.0.0.1"
    environment:
      - CONFIG_FILE=./env/local.js
      # ---------------------------------------------------------------------
      # THE MOCK STS'S CERTIFICATE, IN THIS SERVICE'S TRUSTSTORE.
      #
      # That mock serves its main port over TLS on this stack (see STS_HTTPS on
      # the `sts` service for why the scheme moved to the process when the RFC
      # 9700 pass became a trust realm), on a self-signed certificate it
      # regenerates every start — so nothing can have an anchor for it ahead of
      # time. api/sts_truststore.sh, this image's entrypoint, fetches it from
      # this URL before the server starts and points NODE_EXTRA_CA_CERTS at it.
      # Unset, the entrypoint does nothing, which is what a deployed api wants.
      #
      # This is a truststore addition, not a verification switch: every other
      # certificate this service meets is still verified, which is what
      # api_ssrf_guard.js, api_tls_probe.js and url_safety_schemes.js assert.
      # ---------------------------------------------------------------------
      - STS_CERT_URL=https://localhost:8081/tls/server-certificate
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        CONFIG_FILE: ${CONFIG_FILE}
        # Optional: CI fixes the build number so the image and the git tag agree.
        # Unset locally -> version.js falls back to the UTC build instant.
        BUILD_NUMBER: ${BUILD_NUMBER:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    depends_on:
      keycloak:
        condition: service_healthy
      # So the entrypoint's certificate fetch has something to fetch from. It
      # retries regardless (see api/sts_truststore.sh), but depends_on turns the
      # ordinary case into no retries at all.
      sts:
        condition: service_healthy
    healthcheck:
      test: curl -X GET http://localhost:4000
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  client:
    container_name: client
    hostname: client
    image: rcbj/client
    network_mode: "host"
    environment:
      - CONFIG_FILE=./env/local.js
    build:
      context: .
      dockerfile: client/Dockerfile 
      args:
        CONFIG_FILE: ${CONFIG_FILE}
    healthcheck:
      test: curl -X GET http://localhost:3000
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
     keycloak:
        condition: service_healthy
  sts:
    container_name: sts
    hostname: sts
    image: rcbj/sts
    # ROOT, and the only container here that is. It binds 88 (TCP and UDP),
    # 389 and 636 — all privileged — so it needs uid 0 or
    # CAP_NET_BIND_SERVICE; and sts/ is the mock-sts submodule, somebody
    # else's checkout. Every image THIS repository builds now runs as an
    # unprivileged user; see the block at the foot of each Dockerfile.
    network_mode: "host"
    environment:
      # THE MOCK STS'S LOG LEVEL, passed through from whoever ran the launcher
      # rather than given a value here.
      #
      # THE BARE FORM IS LOAD-BEARING AND THE OBVIOUS ALTERNATIVE BREAKS THE
      # CONTAINER. With no `=`, compose passes the variable through ONLY if the
      # host shell has it set and leaves it unset here otherwise, so the
      # appconfig file's own level keeps applying when nobody asked for
      # anything else. Written as `STS_LOG_LEVEL=${STS_LOG_LEVEL:-}` it would
      # instead be set to the EMPTY STRING, and that is not a harmless default:
      # bunyan throws `unknown level name: ""` from config.js's registerLogger()
      # at require time, so the mock does not start at all. `docker compose
      # config` tells the two apart — the bare form renders null, the assigned
      # one renders "".
      #
      # Why it is worth having: the mock logs every request, every response and
      # every artifact before and after signing, at debug. That is the point of
      # a mock and is the record of what it issued when a test fails, so debug
      # stays the default. It is also about half the service's CPU, and a
      # benchmark of it wrote 156MB in sixteen seconds — so a run with several
      # jobs hitting one instance at once can set STS_LOG_LEVEL=info and roughly
      # double what that instance can answer.
      - STS_LOG_LEVEL
      # ---------------------------------------------------------------------
      # THE MAIN PORT IS HTTPS, AND THE WHOLE SUITE TALKS TO IT THAT WAY.
      #
      # This replaced a SECOND mock instance. RFC 9700 mode used to need one:
      # `oauth2.rfc9700` derives `global.https` in that service, so it binds
      # 8081 as TLS, and one process could not serve the permissive pass and
      # the compliant one. Since mock-sts marks that flag `realmRuntime` it can
      # be set on a TRUST REALM — a realm binds no socket, so only the mode's
      # checks change — and `/realm/rfc9700/...` is the compliant server while
      # `/...` stays permissive. See common/common.sh's
      # configureStsRfc9700Realm().
      #
      # WHAT A REALM CANNOT BRING WITH IT IS A SCHEME. The port is HTTPS or it
      # is not, for every realm at once, and the RFC 9700 pass is only honest
      # over TLS — requirement 8.1 is that every configured endpoint is https,
      # and the debugger enforces it. So the scheme moves to the PROCESS, here,
      # and every STS URL in the suite is https.
      #
      # `STS_HTTPS` rather than `STS_OAUTH2_RFC9700`: that one would turn the
      # mode on for the DEFAULT realm too, and the permissive pass — twelve
      # jobs — is the other half of the matrix. This is the setting that exists
      # to separate the two.
      #
      # THE COST IS A CERTIFICATE NOBODY HAS AN ANCHOR FOR: it is self-signed
      # and regenerated on every start, so it cannot be baked into an image or
      # a truststore ahead of time. It is fetched from
      # /tls/server-certificate once the service is up and installed for the
      # two things that verify — node, through NODE_EXTRA_CA_CERTS, and Chrome,
      # through an exact SPKI pin. common/common.sh's trustStsCertificate()
      # does it for the host-side launchers; the `api` service above does its
      # own, because it starts before any launcher could hand it one.
      - STS_HTTPS=true
    build:
      # The submodule's own root: see docker-compose.yml for why the context is
      # ./sts rather than this repository with dockerfile: sts/Dockerfile.
      context: ./sts
    # https, and `rejectUnauthorized:false` — the certificate is self-signed and
    # regenerated every start, so nothing in this container can have an anchor
    # for it. Liveness is this check's question, not trust.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get({host:'localhost',port:8081,path:'/healthcheck',rejectUnauthorized:false},function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # WS-Federation IdP side-car (Keycloak 8.0.1 + cloudtrust keycloak-wsfed). Host
  # networking, so it uses a WildFly port-offset of 2 (HTTP -> 8082) to avoid
  # colliding with the 26.x Keycloak (8080) and the STS (8081). configureKeycloakWsfed
  # provisions it; the WS-Fed test reaches it at http://localhost:8082/auth.
  # No hostname: under host networking Docker adds no /etc/hosts entry for it, so
  # the name it sets resolves to nothing INSIDE the container — and Keycloak 8's H2
  # datasource resolves its own hostname (AUTO_SERVER), so the database failed to
  # open and the whole boot was rolled back. The image now strips AUTO_SERVER as
  # well; both are needed, because anything else in there that calls
  # InetAddress.getLocalHost() has the same problem (WildFly's transaction manager
  # already logs ARJUNA012210 about it). Without this line the container inherits
  # the host's hostname, which does resolve. The walt.id services here omit it for
  # the same reason.
  keycloak-wsfed:
    container_name: keycloak-wsfed
    image: rcbj/keycloak-wsfed
    network_mode: "host"
    build:
      context: .
      dockerfile: keycloak-wsfed/Dockerfile
    command: ["-b", "0.0.0.0", "-Djboss.socket.binding.port-offset=2"]
    environment:
      KEYCLOAK_USER: keycloak
      KEYCLOAK_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/auth/realms/master || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 150s

  # walt.id issuer-api2 — the real OpenID4VCI 1.0 Credential Issuer the interop
  # suite (tests/sd_jwt_vc_waltid.js) runs against, beside our own mock. Host
  # networking like everything else here, so the host-run browser reaches it at
  # localhost:7005 and it reaches Keycloak on the same loopback. Its signing key
  # comes from the environment (generateWaltidIssuerKey in common/common.sh) —
  # no private key is committed.
  waltid-issuer-api:
    image: waltid/issuer-api2:0.23.0
    # A Jib-built image, and Jib's default is uid 0 — walt.id set no user of
    # its own. It needs none: its configuration is bind-mounted READ-ONLY,
    # persistence.conf puts sessions in memory, and its signing key comes
    # from the environment, so it writes nothing outside /tmp. 1000:1000 has
    # no passwd entry in that image, which the JVM does not care about.
    user: "1000:1000"
    # No hostname: under host networking it resolves to nothing, and the
    # service's logger prints an UnknownHostException stack trace over it.
    network_mode: "host"
    volumes:
      # Rendered by renderWaltidConfig() (common/common.sh) with this run's
      # values — including its signing key — written in, so nothing here
      # depends on how walt.id's config loader expands ${...}.
      - ./waltid/generated-config:/waltid-issuer-api2/config:ro

  # CORS in front of the issuer. walt.id's services send no CORS headers of their
  # own — they install no CORS plugin, and walt.id's own stack fronts every one of
  # them for that reason — and a browser-based wallet cannot read a response
  # without them. This IS the address the wallet uses, and the address the
  # issuer's baseUrl names, because every URL walt.id publishes is built from it.
  # A stock node image runs it: waltid/cors-proxy.js has no dependencies.
  waltid-issuer:
    image: node:24-alpine
    # The stock node image runs as root unless told otherwise; it ships a
    # `node` account at uid 1000 for exactly this. The proxy binds 7005/7003
    # (above 1024), reads one bind-mounted script and writes nothing.
    user: "node"
    command: ["node", "/waltid/cors-proxy.js"]
    network_mode: "host"
    environment:
      - WALTID_UPSTREAM=localhost:7006
      - WALTID_PROXY_PORT=7005
    volumes:
      - ./waltid/cors-proxy.js:/waltid/cors-proxy.js:ro
    healthcheck:
      # The whole chain: this proxy answering, and the issuer behind it serving
      # the metadata a wallet asks for first. The probe lives here rather than on
      # the issuer because that image is built with Jib and has no shell for
      # CMD-SHELL to run — a probe there can never pass, and compose then waits
      # forever on a service that is working perfectly.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:7005/.well-known/openid-credential-issuer/openid4vci',function(r){var b='';r.on('data',function(d){b+=d});r.on('end',function(){process.exit(r.statusCode===200&&b.indexOf('credential_issuer')!==-1?0:1)})}).on('error',function(){process.exit(1)})\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      waltid-issuer-api:
        condition: service_started

  # walt.id's VERIFIER (verifier-api2) — the interoperability counterpart for the
  # PRESENTATION workflow, beside our own mock. Host networking like everything
  # else here, so the host-run browser reaches the proxy at localhost:7003. Its
  # request-signing key comes from the environment (generateWaltidVerifierKey in
  # common/common.sh) — no private key is committed.
  waltid-verifier-api:
    image: waltid/verifier-api2:0.23.0
    # A Jib-built image, and Jib's default is uid 0 — walt.id set no user of
    # its own. It needs none: its configuration is bind-mounted READ-ONLY,
    # persistence.conf puts sessions in memory, and its signing key comes
    # from the environment, so it writes nothing outside /tmp. 1000:1000 has
    # no passwd entry in that image, which the JVM does not care about.
    user: "1000:1000"
    # No hostname: under host networking it resolves to nothing, and the
    # service's logger prints an UnknownHostException stack trace over it.
    network_mode: "host"
    volumes:
      # Rendered by renderWaltidConfig() (common/common.sh). A SEPARATE directory
      # from the issuer's: walt.id reads whatever conf files are in the directory
      # it is given, and the two services must not be handed each other's.
      - ./waltid/generated-verifier-config:/waltid-verifier-api2/config:ro

  # CORS in front of the verifier, for the same reason the issuer has one, and it
  # IS the address the verifier's urlPrefix names.
  waltid-verifier:
    image: node:24-alpine
    # The stock node image runs as root unless told otherwise; it ships a
    # `node` account at uid 1000 for exactly this. The proxy binds 7005/7003
    # (above 1024), reads one bind-mounted script and writes nothing.
    user: "node"
    command: ["node", "/waltid/cors-proxy.js"]
    network_mode: "host"
    environment:
      - WALTID_UPSTREAM=localhost:7004
      - WALTID_PROXY_PORT=7003
    volumes:
      - ./waltid/cors-proxy.js:/waltid/cors-proxy.js:ro
    healthcheck:
      # /livez is what walt.id's service-commons registers for every service. The
      # probe is on the proxy because the verifier image has no shell for
      # CMD-SHELL to run; this covers the whole chain.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:7003/livez',function(r){process.exit(r.statusCode<500?0:1)}).on('error',function(){process.exit(1)})\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
volumes:
  postgres_data:
