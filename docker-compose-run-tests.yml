#version: '3'
services:
  postgres:
    image: postgres:18
    # No `user:` needed and one would BREAK it: the official image's
    # entrypoint starts as root only to create and chown PGDATA on a fresh
    # volume, then drops to the `postgres` account with gosu before the
    # server starts. Pinning a user here skips the chown and initdb fails on
    # a directory it cannot write.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
      # postgres:18 refuses to start on a data dir initialized by an older
      # major version. Initialize into a fresh subdirectory of the volume so
      # the upgrade starts cleanly (test data is disposable and recreated each
      # run); any legacy PG17 files at the volume root are ignored.
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: pg_isready
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 45s
    ports:
      - 5432:5432
    networks:
      - keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    # Already non-root: the Keycloak image declares USER 1000 itself.
    # DPoP (RFC 9449) is a PREVIEW feature in Keycloak 26 and is off unless it is
    # named here: without it the server ignores the DPoP header entirely, issues a
    # perfectly ordinary Bearer token, and advertises no
    # dpop_signing_alg_values_supported — so the OIDC DPoP jobs would fail with "the
    # token came back unbound", which reads as a client bug rather than as a server
    # that was never asked to support it. tests/oidc_flows.js checks that
    # advertisement before running an OIDC_DPOP=on job and says so by name.
    command: ["start-dev", "--features=dpop"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: keycloak
      KEYCLOAK_ADMIN_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    hostname: keycloak
    ports:
      - "8080:8080"
    # Probe /health/ready on the management port and require "UP". Well-formed
    # HTTP/1.0 request via bash /dev/tcp (no curl in the image); generous
    # start_period for a cold first start on a fresh image + DB.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 || exit 1; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q 'UP' <&3"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 150s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak
  api:
    container_name: api
    image: rcbj/api
    environment:
      # api and client KEEP this file. `api/env/test.js` is the deployed-site
      # configuration (https://api.tools.test.idptools.io), not a compose one, so
      # pointing this container at it would break the stack rather than quieten
      # it; the api's level is fixed in api/env/docker-tests.js instead. The
      # client has no test.js at all, and contributed ZERO debug lines here —
      # its logging goes to the BROWSER console.
      - CONFIG_FILE=./env/docker-tests.js
      # ---------------------------------------------------------------------
      # THE MOCK STS'S CERTIFICATE, IN THIS SERVICE'S TRUSTSTORE.
      #
      # That mock serves its main port over TLS on this stack (see STS_HTTPS on
      # the `sts` service for why the scheme moved to the process when the RFC
      # 9700 pass became a trust realm), on a self-signed certificate it
      # regenerates every start — so nothing can have an anchor for it ahead of
      # time. api/sts_truststore.sh, this image's entrypoint, fetches it from
      # this URL before the server starts and points NODE_EXTRA_CA_CERTS at it.
      # Unset, the entrypoint does nothing, which is what a deployed api wants.
      #
      # This is a truststore addition, not a verification switch: every other
      # certificate this service meets is still verified, which is what
      # api_ssrf_guard.js, api_tls_probe.js and url_safety_schemes.js assert.
      # ---------------------------------------------------------------------
      - STS_CERT_URL=https://sts:8081/tls/server-certificate
      - TLS_ENABLED=true
      - TLS_CERT_FILE=/etc/idptools/tls/stack-tls-cert.pem
      - TLS_KEY_FILE=/etc/idptools/tls/stack-tls-key.pem
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        CONFIG_FILE: ${CONFIG_FILE}
        # Optional: CI fixes the build number so the image and the git tag agree.
        # Unset locally -> version.js falls back to the UTC build instant.
        BUILD_NUMBER: ${BUILD_NUMBER:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    depends_on:
      keycloak:
        condition: service_healthy
      # So the entrypoint's certificate fetch has something to fetch from. It
      # retries regardless (see api/sts_truststore.sh), but depends_on turns the
      # ordinary case into no retries at all.
      sts:
        condition: service_healthy
    # The stack's TLS pair, generated on the host before compose starts. See
    # the same mount in local-tests.yml and the header of
    # common/tls_listener.js: ONE pair for the api and the client, because the
    # mock STS has to be handed the api's anchor in order to push to it.
    volumes:
      - ${STACK_TLS_DIR:-./generated-tls}:/etc/idptools/tls:ro
    healthcheck:
      # https, verified against the certificate mounted above rather than -k:
      # a healthcheck that skipped verification would report a healthy
      # container for a service serving a certificate nothing else trusts.
      # NO -f, matching what this probe has always asserted: the api answers
      # 404 at `/` (it has no route there), so a status check would fail a
      # perfectly healthy container. What is being tested is that the port
      # answers and that the TLS handshake completes — which --cacert makes a
      # real assertion rather than the decoration -k would leave it as.
      test: curl -s --cacert /etc/idptools/tls/stack-tls-cert.pem
        https://localhost:4000
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - keycloak
    ports:
      - 4000:4000
  client:
    container_name: client
    image: rcbj/client
    environment:
      # api and client KEEP this file. `api/env/test.js` is the deployed-site
      # configuration (https://api.tools.test.idptools.io), not a compose one, so
      # pointing this container at it would break the stack rather than quieten
      # it; the api's level is fixed in api/env/docker-tests.js instead. The
      # client has no test.js at all, and contributed ZERO debug lines here —
      # its logging goes to the BROWSER console.
      - CONFIG_FILE=./env/docker-tests.js
      - TLS_ENABLED=true
      - TLS_CERT_FILE=/etc/idptools/tls/stack-tls-cert.pem
      - TLS_KEY_FILE=/etc/idptools/tls/stack-tls-key.pem
    build:
      context: .
      dockerfile: client/Dockerfile 
      args:
        CONFIG_FILE: ${CONFIG_FILE}
    # The stack's TLS pair, generated on the host before compose starts. See
    # the same mount in local-tests.yml and the header of
    # common/tls_listener.js: ONE pair for the api and the client, because the
    # mock STS has to be handed the api's anchor in order to push to it.
    volumes:
      - ${STACK_TLS_DIR:-./generated-tls}:/etc/idptools/tls:ro
    healthcheck:
      # See the api's.
      # See the api's, above: no -f, and --cacert rather than -k.
      test: curl -s --cacert /etc/idptools/tls/stack-tls-cert.pem
        https://localhost:3000
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak
    ports:
      - 3000:3000
  # WS-Trust STS (mock) for the WS-Trust workflow tests. The browser (in the
  # tests container) and the api /wstrust proxy reach it by its compose DNS name
  # sts:8081 — matching env/docker-tests.js wstrustStsUrlDefault.
  sts:
    container_name: sts
    image: rcbj/sts
    # ---------------------------------------------------------------------
    # THE ONE CONTAINER IN THIS STACK THAT IS STILL ROOT, AND THE UMASK IS
    # WHAT THAT COSTS.
    #
    # Every image this repository builds now runs as an unprivileged user
    # (see the block at the foot of each Dockerfile). This one is not this
    # repository's image — sts/ is the mock-sts submodule — and it could not
    # make the change anyway: it binds 88 (the KDC, TCP and UDP), 389 and 636
    # (the directory), all three privileged, so it needs uid 0 or
    # CAP_NET_BIND_SERVICE and neither is somebody else's checkout's business
    # to decide here.
    #
    # What that leaves is the SOCKET below. STS_SPIFFE_SERVER_SOCKET makes
    # this service bind /spire-sock/server.sock, and the tests container —
    # which is NOT root any more — dials it. A Unix socket is created with
    # mode 0777 & ~umask, so at the default 022 it lands 0755 root:root, and
    # connect(2) on a Unix socket needs WRITE permission on the file: the
    # tests container would be refused with EACCES, and spiffe_protocol.js
    # would report its Debug.GetInfo check as a failed gRPC call rather than
    # as a permission problem. `umask 0000` makes it 0777, which is the
    # ordinary arrangement for a socket meant to be dialled by anyone —
    # inside a throwaway container, on a docker volume that exists for the
    # length of one test run and holds no bytes.
    #
    # The command is SPELLED OUT here rather than left to the image, because
    # setting `entrypoint:` in compose CLEARS the image's CMD (compose does
    # this; plain docker does not). `node server.js` is sts/Dockerfile's own
    # CMD and the two have to be kept in step — that image declares no
    # ENTRYPOINT, so there is nothing else here that can drift.
    # ---------------------------------------------------------------------
    entrypoint: ["/bin/sh", "-c", "umask 0000; exec node server.js"]
    # The mock OID4VCI Credential Issuer this service also hosts advertises
    # ITSELF as its authorization server, so an issuer-initiated offer can be
    # walked end to end without a second identity provider. Set
    # OID4VCI_AUTHORIZATION_SERVER to point it at a real one instead.
    environment:
      # Log level, chosen the same way as for api and client.
      # ---------------------------------------------------------------
      # THE INFO FILE, AND A KNOB OF ITS OWN SO THE LAUNCHER CANNOT CLOBBER IT.
      #
      # This was `./env/docker-tests.js` until 2026-08-31 — the DEBUG file — and
      # `STS_LOG_LEVEL: info` in the workflow did not hold it back. One CI run
      # of this stack produced a 37 MB job log of which 96.6% was debug:
      # 239,536 level-20 lines against 8,431 level-30, split sts 224,719 /
      # tests 167,037 / api 16,175.
      #
      # THE REASON THE LEVEL DID NOT REACH IT is the trap the mock's own
      # launcher documents at length: `STS_LOG_LEVEL` reaches the loggers
      # `config.js` registers, and NOT the modules that build a bunyan logger
      # at load from `require(process.env.CONFIG_FILE).logLevel` — the mock's
      # six vendored ones, and this project's own `common/` crypto modules.
      # `xmldsig` alone was 208,966 lines, which is every canonicalization of
      # every signed document.
      #
      # `sts/env/test.js` is `env/local.js` with one key changed, so this
      # swaps the level and nothing else. A debug run is
      # `STS_CONFIG_FILE=./env/docker-tests.js ...`.
      #
      # ITS OWN VARIABLE rather than `${CONFIG_FILE:-…}`, because
      # `docker-run-tests.sh` EXPORTS CONFIG_FILE with a default of its own —
      # so a compose-level default here would never be reached. That variable
      # still selects the api and client build configs, which is what it is
      # for; this service needs a different answer from theirs and now has one.
      - CONFIG_FILE=${STS_CONFIG_FILE:-./env/test.js}
      # THE MOCK STS'S LOG LEVEL, passed through from whoever ran the launcher
      # rather than given a value here.
      #
      # THE BARE FORM IS LOAD-BEARING AND THE OBVIOUS ALTERNATIVE BREAKS THE
      # CONTAINER. With no `=`, compose passes the variable through ONLY if the
      # host shell has it set and leaves it unset here otherwise, so the
      # appconfig file's own level keeps applying when nobody asked for
      # anything else. Written as `STS_LOG_LEVEL=${STS_LOG_LEVEL:-}` it would
      # instead be set to the EMPTY STRING, and that is not a harmless default:
      # bunyan throws `unknown level name: ""` from config.js's registerLogger()
      # at require time, so the mock does not start at all. `docker compose
      # config` tells the two apart — the bare form renders null, the assigned
      # one renders "".
      #
      # Why it is worth having: the mock logs every request, every response and
      # every artifact before and after signing, at debug. That is the point of
      # a mock and is the record of what it issued when a test fails, so debug
      # stays the default. It is also about half the service's CPU, and a
      # benchmark of it wrote 156MB in sixteen seconds — so a run with several
      # jobs hitting one instance at once can set STS_LOG_LEVEL=info and roughly
      # double what that instance can answer.
      - STS_LOG_LEVEL
      # Where the WALLET lives, as a base URL the BROWSER can use.
      #
      # The mock issuer's Credential Offer pages and the mock verifier's request
      # pages both link the End-User back to the wallet, appending
      # /vc-issuance-1.html or /vc-presentation-1.html to this. It
      # defaults to http://localhost:3000, which is right for the host-networking
      # local stack and WRONG here: the browser runs in the tests container, where
      # localhost:3000 is nothing at all, so those links went nowhere and the H.1
      # and presentation flows timed out waiting for a page that never loaded.
      # OID4VP_WALLET_URL falls back to this, so one setting covers both.
      - OID4VCI_WALLET_URL=https://client:3000
      # THE SPIRE SERVER API'S PRIVATE UNIX SOCKET, which ships OFF.
      #
      # It is on here for one reason: it is the `local` entity, and `local` is
      # a whole class in SPIRE's authorization table that nothing else can
      # reach. `Debug.GetInfo` is LOCAL-ONLY — an administrator's X509-SVID
      # over TCP is refused it — so without this socket the suite can assert
      # that refusal and can never see the method answer, which leaves half of
      # that row untested.
      - STS_SPIFFE_SERVER_SOCKET_ENABLED=true
      # A SHORT path, and the shortness is load-bearing: a Unix socket path is
      # bounded by `sun_path` at 108 bytes, and past it bind and connect fail
      # with a message about the address already being in use — naming
      # something that is not the problem. This one is well inside it and is
      # the directory the volume below is mounted at on both sides.
      - STS_SPIFFE_SERVER_SOCKET=/spire-sock/server.sock
      # ---------------------------------------------------------------------
      # THE MAIN PORT IS HTTPS, AND THE WHOLE SUITE TALKS TO IT THAT WAY.
      #
      # This replaced a SECOND mock instance (`sts-rfc9700`, deleted). RFC 9700
      # mode used to need one: `oauth2.rfc9700` derives `global.https` in that
      # service, so it binds 8081 as TLS, and one process could not serve the
      # permissive pass and the compliant one. Since mock-sts marks that flag
      # `realmRuntime` it can be set on a TRUST REALM — a realm binds no socket,
      # so only the mode's checks change — and `/realm/rfc9700/...` is the
      # compliant server while `/...` stays permissive. See common/common.sh's
      # configureStsRfc9700Realm().
      #
      # WHAT A REALM CANNOT BRING WITH IT IS A SCHEME. The port is HTTPS or it
      # is not, for every realm at once, and the RFC 9700 pass is only honest
      # over TLS — requirement 8.1 is that every configured endpoint is https,
      # and the debugger enforces it. So the scheme moves to the PROCESS.
      #
      # `STS_HTTPS` rather than `STS_OAUTH2_RFC9700`: that one would turn the
      # mode on for the DEFAULT realm too, and the permissive pass — twelve
      # jobs — is the other half of the matrix. This is the setting that exists
      # to separate the two.
      #
      # The certificate is self-signed and regenerated every start, so nothing
      # can have an anchor for it ahead of time. The `api` service fetches it
      # in its own entrypoint (STS_CERT_URL) and the tests container fetches it
      # in trustStsCertificate() (common/common.sh).
      - STS_HTTPS=true
      # The stack's anchor, so this service can PUSH a Security Event Token to
      # the api over TLS (RFC 8935). See the long note on the same line in
      # local-tests.yml: this is the only outbound connection from the mock to
      # the api, and without the anchor the push fails the handshake and reads
      # as a transmitter that sent nothing.
      - NODE_EXTRA_CA_CERTS=/etc/idptools/tls/stack-tls-cert.pem
    volumes:
      # Shared with the tests container so `spiffe_protocol.js` can dial it.
      # A socket is a rendezvous point rather than a file — it holds no bytes,
      # it is unlinked on close, and a fresh process makes a fresh one — so
      # what crosses here is reachability and nothing else.
      - spire-server-socket:/spire-sock
      - ${STACK_TLS_DIR:-./generated-tls}:/etc/idptools/tls:ro
    build:
      # The submodule's own root: see docker-compose.yml for why the context is
      # ./sts rather than this repository with dockerfile: sts/Dockerfile.
      context: ./sts
    # https, and `rejectUnauthorized:false` — the certificate is self-signed and
    # regenerated every start, so nothing in this container can have an anchor
    # for it. Liveness is this check's question, not trust.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get({host:'localhost',port:8081,path:'/healthcheck',rejectUnauthorized:false},function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      keycloak:
        aliases:
          # A SECOND NAME FOR THIS CONTAINER, AND THE POINT IS THAT ITS
          # CERTIFICATE DOES NOT CARRY IT.
          #
          # tests/api_ldap.js binds this service's LDAPS socket under this name
          # to prove that the `api` still VERIFIES certificates. It cannot
          # prove that with an untrusted certificate any more: that service's
          # entrypoint fetches this one's self-signed certificate into
          # NODE_EXTRA_CA_CERTS on every start (STS_CERT_URL), so the anchor is
          # deliberately there and the connection deliberately succeeds. What a
          # truststore entry does NOT do is switch off hostname verification,
          # so a name outside the certificate's subjectAltName is the one
          # refusal left that only a verifying client can produce — which is
          # what keeps every `rejectUnauthorized: false` in that file from
          # being a decoration.
          #
          # The certificate is generated with SANs localhost, sts, sts-mock,
          # sts.example.com and 127.0.0.1, so this name must stay OUT of that
          # list. local-tests.yml provides the same name through the api's
          # extra_hosts, because that stack has no Docker DNS at all.
          - sts-not-in-the-certificate
    ports:
      - 8081:8081
  # walt.id issuer-api2 — a REAL OpenID4VCI 1.0 Credential Issuer, run beside the
  # mock one so the SD-JWT VC workflow can be shown to work against an
  # independent implementation and not only against our own. Its configuration
  # is in waltid/config (bind-mounted), and its signing key comes from the
  # environment (generateWaltidIssuerKey in common/common.sh) so no private key
  # is committed. The browser in the tests container reaches it by its compose
  # DNS name, which is why WALTID_BASE_URL must be that name: every URL walt.id
  # publishes in its metadata is built from it.
  waltid-issuer-api:
    container_name: waltid-issuer-api
    image: waltid/issuer-api2:0.23.0
    # A Jib-built image, and Jib's default is uid 0 — walt.id set no user of
    # its own. It needs none: its configuration is bind-mounted READ-ONLY,
    # persistence.conf puts sessions in memory, and its signing key comes
    # from the environment, so it writes nothing outside /tmp. 1000:1000 has
    # no passwd entry in that image, which the JVM does not care about.
    user: "1000:1000"
    volumes:
      # Rendered by renderWaltidConfig() (common/common.sh) with this run's
      # values — including its signing key — written in, so nothing here
      # depends on how walt.id's config loader expands ${...}.
      - ./waltid/generated-config:/waltid-issuer-api2/config:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak

  # CORS in front of the issuer. walt.id's services send no CORS headers of their
  # own — they install no CORS plugin, and walt.id's own stack fronts every one of
  # them for that reason — and a browser-based wallet cannot read a response
  # without them. This IS the address the wallet uses, and the address the
  # issuer's baseUrl names, because every URL walt.id publishes is built from it.
  # A stock node image runs it: waltid/cors-proxy.js has no dependencies.
  waltid-issuer:
    container_name: waltid-issuer
    image: node:24-alpine
    # The stock node image runs as root unless told otherwise; it ships a
    # `node` account at uid 1000 for exactly this. The proxy binds 7005/7003
    # (above 1024), reads one bind-mounted script and writes nothing.
    user: "node"
    command: ["node", "/waltid/cors-proxy.js"]
    environment:
      - WALTID_UPSTREAM=waltid-issuer-api:7006
      - WALTID_PROXY_PORT=7005
    volumes:
      - ./waltid/cors-proxy.js:/waltid/cors-proxy.js:ro
    healthcheck:
      # The whole chain: this proxy answering, and the issuer behind it serving
      # the metadata a wallet asks for first. The probe lives here rather than on
      # the issuer because that image is built with Jib and has no shell for
      # CMD-SHELL to run — a probe there can never pass, and compose then waits
      # forever on a service that is working perfectly.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:7005/.well-known/openid-credential-issuer/openid4vci',function(r){var b='';r.on('data',function(d){b+=d});r.on('end',function(){process.exit(r.statusCode===200&&b.indexOf('credential_issuer')!==-1?0:1)})}).on('error',function(){process.exit(1)})\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      waltid-issuer-api:
        condition: service_started
    networks:
      - keycloak
    ports:
      - 7005:7005
  # walt.id's VERIFIER (verifier-api2), the other half of the interoperability
  # story: an independently written OpenID4VP 1.0 verifier with DCQL, so the
  # presentation workflow is driven against someone else's reading of the spec
  # rather than only against our own mock. Its configuration is in
  # waltid/verifier-config (rendered, bind-mounted); its request-signing key comes
  # from the environment (generateWaltidVerifierKey in common/common.sh) so no
  # private key is committed.
  waltid-verifier-api:
    container_name: waltid-verifier-api
    image: waltid/verifier-api2:0.23.0
    # A Jib-built image, and Jib's default is uid 0 — walt.id set no user of
    # its own. It needs none: its configuration is bind-mounted READ-ONLY,
    # persistence.conf puts sessions in memory, and its signing key comes
    # from the environment, so it writes nothing outside /tmp. 1000:1000 has
    # no passwd entry in that image, which the JVM does not care about.
    user: "1000:1000"
    volumes:
      # Rendered by renderWaltidConfig() (common/common.sh) with this run's
      # values written in, so nothing here depends on how walt.id's config loader
      # expands ${...}. A SEPARATE directory from the issuer's: walt.id reads
      # whatever conf files are in the directory it is given, and the two services
      # must not be handed each other's.
      - ./waltid/generated-verifier-config:/waltid-verifier-api2/config:ro
    networks:
      - keycloak

  # CORS in front of the verifier, for the same reason the issuer has one: walt.id
  # installs no CORS plugin, and the wallet is a browser page that has to read the
  # Request Object and POST the presentation. THIS is the address the verifier's
  # urlPrefix names, so every URL it hands the wallet is one the browser can use.
  waltid-verifier:
    container_name: waltid-verifier
    image: node:24-alpine
    # The stock node image runs as root unless told otherwise; it ships a
    # `node` account at uid 1000 for exactly this. The proxy binds 7005/7003
    # (above 1024), reads one bind-mounted script and writes nothing.
    user: "node"
    command: ["node", "/waltid/cors-proxy.js"]
    environment:
      - WALTID_UPSTREAM=waltid-verifier-api:7004
      - WALTID_PROXY_PORT=7003
    volumes:
      - ./waltid/cors-proxy.js:/waltid/cors-proxy.js:ro
    healthcheck:
      # /livez is the health endpoint walt.id's service-commons registers for
      # every service. The probe lives on the proxy, not the verifier, because
      # that image is built with Jib/Corretto and has no shell for CMD-SHELL to
      # run — a probe there can never pass and compose would wait forever on a
      # service that is working perfectly. This one covers the whole chain.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:7003/livez',function(r){process.exit(r.statusCode<500?0:1)}).on('error',function(){process.exit(1)})\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      waltid-verifier-api:
        condition: service_started
    networks:
      - keycloak
    ports:
      - 7003:7003
  # WS-Federation IdP side-car: Keycloak 8.0.1 + cloudtrust keycloak-wsfed module.
  # The main 26.x Keycloak has no WS-Fed support and the extension only targets
  # 8.0.1, so WS-Fed gets its own image. Reached by the browser (in the tests
  # container) and the api /samlmetadata proxy at keycloak-wsfed:8080/auth.
  keycloak-wsfed:
    container_name: keycloak-wsfed
    image: rcbj/keycloak-wsfed
    build:
      context: .
      dockerfile: keycloak-wsfed/Dockerfile
    hostname: keycloak-wsfed
    environment:
      KEYCLOAK_USER: keycloak
      KEYCLOAK_PASSWORD: keycloak
    # WildFly Keycloak 8.0.1 has no /health endpoint; probe the master realm.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/auth/realms/master || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 150s
    networks:
      - keycloak
    ports:
      - "8082:8080"
  tests:
    container_name: tests
    image: rcbj/test
    # Point the WS-Federation provisioning + test at the side-car by its compose
    # DNS name (the entrypoint defaults these empty so live-site runs skip WS-Fed).
    environment:
      # THE SUITE'S CONFIG, AND IT MATTERS FOR A SECOND REASON.
      #
      # `tests/env/test.js` and `tests/env/docker-tests.js` are identical in
      # content — both `waitTime: 2000` and `LOG_LEVEL: 'info'` — so for this
      # project's own scripts the choice is a no-op. What it changes is the
      # jobs that load the MOCK's modules in process: `sts/common/config_file.js`
      # makes a relative CONFIG_FILE absolute against the MOCK's package root,
      # so `./env/docker-tests.js` became `<sts>/env/docker-tests.js` and every
      # logger loaded after that point — including this project's own — read
      # `debug` out of it. That is the 167,037 debug lines the `tests`
      # container contributed. `./env/test.js` resolves to `sts/env/test.js`
      # on that same rule, which is the info twin.
      CONFIG_FILE: ${TESTS_CONFIG_FILE:-./env/test.js}
      KEYCLOAK_WSFED_BASE_URL: http://keycloak-wsfed:8080
      KEYCLOAK_WSFED_LOCALHOST_BASE_URL: http://keycloak-wsfed:8080
      # How many jobs run at once. Passed THROUGH from the host so
      # `TEST_CONCURRENCY=6 ./docker-run-tests.sh` reaches run-report.js, which
      # otherwise sizes the pool from this container's view of the cores. Empty
      # means "decide there" (2..4, one less than the cores); 1 restores the
      # old sequential run with live output. See run-report.js.
      TEST_CONCURRENCY: ${TEST_CONCURRENCY:-}
      # The per-job watchdog, passed through beside it so the pool is tunable
      # from one place. run-report.js kills the process TREE of a job that has
      # not exited in this long (default 900000 — 15 minutes) and records it as
      # a timeout; 0 disables the clock while leaving the reaping in place.
      # It matters more here than on the host: every other service in this
      # stack shares the machine with the pool, so a job that is merely starved
      # looks exactly like one that has hung.
      TEST_JOB_TIMEOUT_MS: ${TEST_JOB_TIMEOUT_MS:-}
      # HOW LONG A BROWSER WAIT MAY TAKE, passed through for the run that
      # needs a different answer from the plain one. `waitTime` in
      # tests/env/*.js is two seconds, which is right for these bundles and
      # not right for the Istanbul-INSTRUMENTED ones ./run-coverage.sh
      # serves — that launcher exports 10000 and this is how it arrives.
      # Empty means the config file's own value, so nothing changes for a
      # run that asks for nothing. See tests/env/test.js.
      TEST_WAIT_TIME_MS: ${TEST_WAIT_TIME_MS:-}
      # THE NAME THE TRANSMITTER HAS TO REACH THIS CONTAINER BY, which is
      # the one thing about RFC 8935 push delivery that cannot be worked out
      # from inside the test. `ssf_protocol.js` hosts a push endpoint of its
      # own — that is what makes push testable end to end at all, since the
      # far end of a push has to be an HTTP server and a browser is not one —
      # and it has to hand the mock a URL the MOCK can dial. Its own idea of
      # itself is `localhost`, which on this bridge stack is the sts container
      # rather than this one, so the push would be delivered to the
      # transmitter itself and the test would wait for an event that had
      # already arrived somewhere else.
      #
      # `tests` is this service's compose DNS name. The local launcher needs
      # no such entry and deliberately has none: local-tests.yml puts every
      # service on HOST networking, where the test's own default of
      # `localhost` is already the right answer.
      SSF_RECEIVER_HOST: tests
      # The SPKI pin for the stack's own certificate, so Chrome in here
      # trusts https://client:3000 and https://api:4000. FORWARDED rather
      # than recomputed from the mounted PEM, so that the pin Chrome is
      # given and the key the services serve cannot disagree. Bare form:
      # unset on the host means unset here, which is a stack with TLS off
      # rather than an empty pin Chrome would match against no key.
      STACK_TLS_SPKI_PIN:
      # Where the mock's SPIRE Server API private socket is mounted in this
      # container. It is the `local` entity and the only route to a method
      # SPIRE's own table marks local-only.
      SPIFFE_SERVER_SOCKET: unix:///spire-sock/server.sock
    # Chrome crashes tabs on heavy pages when limited to Docker's default 64MB
    # /dev/shm. The tests also pass --disable-dev-shm-usage; this raises the cap
    # as a belt-and-suspenders mitigation.
    shm_size: '2gb'
    build:
      context: .
      dockerfile: tests/Dockerfile
    # Persist the generated report/logs to the host (gitignored).
    volumes:
      - ./tests/report:/usr/src/app/report
      # The mock's SPIRE Server API Unix socket — see the sts service above.
      # SPIFFE_SERVER_SOCKET names it for spiffe_protocol.js; without the
      # variable that test SKIPS its local-socket section with a reason rather
      # than passing vacuously.
      - spire-server-socket:/spire-sock
      # The stack's TLS pair. The jobs in here fetch https://api:4000 and
      # https://client:3000, so this container needs the anchor for node
      # and the SPKI pin for Chrome — run-tests-in-container.sh installs
      # both from this mount.
      - ${STACK_TLS_DIR:-./generated-tls}:/etc/idptools/tls:ro
    depends_on:
      client:
        condition: service_healthy
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # The RFC 9700 pass no longer has a server of its own: it is a TRUST
      # REALM on this one, created by configureStsRfc9700Realm() in
      # common/common.sh once the service is healthy. So this single wait is
      # what keeps the five compliant jobs from starting against a port that
      # has not bound — a compliant server that is not listening is
      # indistinguishable, from a test, from one that refused.
      sts:
        condition: service_healthy
      waltid-issuer:
        condition: service_healthy
      waltid-verifier:
        condition: service_healthy
      keycloak-wsfed:
        condition: service_healthy
    networks:
     - keycloak

volumes:
  # The mock STS's SPIRE Server API Unix socket, shared with the tests
  # container. See both services above.
  spire-server-socket:
  postgres_data:

networks:
  keycloak:
    driver: bridge
