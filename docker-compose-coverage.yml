# Opt-in code-coverage overlay for the test stack.
#
# Layer it on top of the base test compose file. The simplest way is the
# helper script ./run-coverage.sh, or manually:
#
#   CONFIG_FILE=./env/docker-tests.js \
#     docker compose -f docker-compose-run-tests.yml -f docker-compose-coverage.yml \
#     up --build --abort-on-container-exit --exit-code-from tests
#
# Frontend (browser) coverage is produced by Istanbul-instrumented bundles and
# shipped by each page to the client server, which writes it to
# ./coverage/frontend/.nyc_output. Backend (API) coverage is produced by c8 and
# written to ./coverage/api. See COVERAGE.md for how to render the reports.
services:
  api:
    build:
      args:
        COVERAGE: "true"
    environment:
      - COVERAGE=true
    # Run the API under c8 so HTTP calls made by the Selenium tests are covered.
    # The server installs a SIGTERM/SIGINT handler (COVERAGE=true) so it exits
    # cleanly and c8 can flush coverage when the container is stopped.
    #
    # THE TWO --exclude PATTERNS ARE NOT TIDYING. This report counted code the
    # api neither owns nor runs, and both entries headed its work list:
    #
    #   node-ldapjs   a fork of ldapjs, vendored and used UNMODIFIED, pinned at
    #                 upstream's final commit because upstream is decommissioned
    #                 (see the repo-root CLAUDE.md). 3,742 lines at 56.1%, and
    #                 it supplied the #2 and #4 entries of this report —
    #                 lib/server.js at 685 uncovered lines and
    #                 lib/client/client.js at 430. Dropping it moves the api
    #                 from 66.6% to 69.8% with no test written, and the
    #                 in-process domain already excluded it
    #                 (coverageExcludes() in tests/run-report.js).
    #   version.js    api/Dockerfile stages client/version.js here, and it is a
    #                 BUILD script: what this report measured was whatever ran
    #                 at require time in a container that never calls it —
    #                 36.6%, a fact about the api's startup rather than about
    #                 that file.
    #
    # Both are `**/`-prefixed, and that is load-bearing rather than decorative:
    # a bare pattern matches NOTHING, silently, because c8 resolves paths
    # against a common ancestor rather than against cwd. The same trap is
    # documented at coverageExcludes() in tests/run-report.js, where it was
    # found.
    #
    # tests/coverage_merge.js applies the same set when it merges the three
    # domains, so the published api number and the merged one agree.
    command: ["c8", "--reporter=html", "--reporter=lcov", "--reporter=text-summary", "--reports-dir=/coverage/api", "--exclude=**/node-ldapjs/**", "--exclude=**/version.js", "node", "server.js"]
    stop_grace_period: 30s
    volumes:
      - ./coverage:/coverage
  client:
    build:
      args:
        COVERAGE: "true"
    environment:
      - COVERAGE=true
      - COVERAGE_DIR=/coverage/frontend/.nyc_output
    volumes:
      - ./coverage:/coverage
  # The THIRD domain, and the one the first two could not see. About thirty jobs
  # here never open a browser: they load the real client/src and api modules
  # in-process (module_paths.requireSharedModule) and drive them against the
  # RFCs' own vectors. Nothing instrumented that copy, so every branch they
  # covered was reported UNCOVERED — api/krb5_frame.js read 29.7% while
  # api_krb5_relay.js asserts each of its malformed-frame rejections by name.
  #
  # No wrapper binary and no change to how a job is run: run-report.js sets
  # NODE_V8_COVERAGE on each child it spawns (see the coverage block at the top
  # of that file), node writes the raw data on exit, and c8 renders it at the
  # end of the run, in this container, where the paths still resolve. The image
  # is unchanged — c8 is an ordinary tests/package.json dependency — so only
  # the environment and the mount are needed here.
  tests:
    environment:
      COVERAGE: "true"
      NODE_COVERAGE_DIR: /coverage/node
    volumes:
      - ./coverage:/coverage
