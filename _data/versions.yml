#
# The documentation versions the site publishes, newest first, the
# arrangement iya-sts's site uses (rcbj/iya-sts docs/_data/versions.yml).
# Each is a folder of docs/ holding that release's pages, with its sidebar
# in _data/navigation/<nav>.yml. `nav` is not the folder name because
# Jekyll drops the dots from a data file's name when it makes the key.
#
# The FIRST entry is the latest: the pages being written, which the header's
# switcher marks and every other version's pages point to. `home` is a
# version's overview: the latest's is the repository's README at the site
# root; every snapshot's is its own index.md, that release's README.
#
# A release snapshot adds a row here and a navigation file; docs/CLAUDE.md,
# *Adding a version*, is the recipe. Labels are M.N.P, never a build number.
- { folder: v0.9.6, nav: v0-9-6, label: "0.9.6", note: "latest", home: "/" }
- { folder: v0.9.5, nav: v0-9-5, label: "0.9.5", note: "release", home: "/docs/v0.9.5/" }
- { folder: v0.9.4, nav: v0-9-4, label: "0.9.4", note: "release", home: "/docs/v0.9.4/" }
- { folder: v0.9.3, nav: v0-9-3, label: "0.9.3", note: "release", home: "/docs/v0.9.3/" }
- { folder: v0.9.2, nav: v0-9-2, label: "0.9.2", note: "release", home: "/docs/v0.9.2/" }
- { folder: v0.9.1, nav: v0-9-1, label: "0.9.1", note: "release", home: "/docs/v0.9.1/" }
- { folder: v0.9.0, nav: v0-9-0, label: "0.9.0", note: "release", home: "/docs/v0.9.0/" }
- { folder: v0.8.0, nav: v0-8-0, label: "0.8.0", note: "pre-release", home: "/docs/v0.8.0/" }
