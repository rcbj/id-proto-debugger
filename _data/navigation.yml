# The left-hand navigation of the documentation site
# (https://rcbj.github.io/id-proto-debugger/), drawn by _includes/sidebar.html
# on every page. The same arrangement as the mock STS's own site
# (rcbj/iya-sts, docs/_data/navigation.yml), adapted to this one: the Pages
# source here is the whole repository on the primer theme, so a page under
# docs/ is served from /docs/.
#
# A page that is not listed here is still built and still reachable by a
# link; it simply has no place in the sidebar. ADD A ROW when you add a file
# under docs/.
#
# `url` is the page's built address: `docs/foo.md` is served as
# `/docs/foo.html`, and a directory's `index.md` as the directory itself.
# `children` nests one level, for a family of pages under one overview.
- section: Start here
  items:
    - { title: Overview, url: / }
    - { title: What a protocol debugger is,
        url: /docs/what-is-a-protocol-debugger.html }
    - title: "User guide: OAuth2 / OIDC"
      url: /docs/oauth2-oidc/
      children:
        - { title: OAuth 2.0 grants,
            url: /docs/oauth2-oidc/oauth2-grants.html }
        - { title: OpenID Connect flows,
            url: /docs/oauth2-oidc/oidc-flows.html }
        - { title: Dynamic client registration,
            url: /docs/oauth2-oidc/dynamic-client-registration.html }
        - { title: Token detail and related tools,
            url: /docs/oauth2-oidc/related-tools.html }

