name: Live Site Test (test.idptools.com)

# Runs the full Selenium suite against the DEPLOYED test.idptools.com site by
# invoking ./remote-run-tests.sh — the same script used to run this locally, so
# there is no CI-specific copy of the setup to drift.
#
# It used to drive a compose file of its own (docker-compose-live-tests.yml, now
# deleted), which was a second, smaller implementation of the same idea: that
# stack started keycloak + sts + a tests container, while remote-run-tests.sh also
# starts the WS-Federation Keycloak side-car and walt.id's issuer and verifier.
# Two jobs are gated on walt.id being reachable (WALTID_ISSUER_URL /
# WALTID_VERIFIER_URL) and run-report.js does not add a gated job to the list at
# all — so CI reported 50 tests where a local run reports 52, with nothing saying
# two were missing. That is the failure mode a parallel implementation produces,
# and the reason there is now only one.
#
# The comment in remote-run-tests.sh saying it cannot run from CI was about the
# browser needing to reach the identity stack on loopback. That holds on a
# GitHub-hosted runner because the job runs directly on the VM: the containers
# publish to the VM's localhost and Chrome runs on that same VM. It would NOT
# hold if this job were given a `container:`.
#
# Runs automatically after a successful test-site deploy (post-deploy
# verification), plus nightly and on demand.
#
# NOTE: the workflow_run trigger only fires from this file on the DEFAULT branch
# (master). No branch filter is used: the test-site deploy is itself
# workflow_run-triggered (so it's attributed to master), and this suite targets
# the public URL rather than a specific commit — it just needs the deploy to
# have succeeded.

on:
  # After the test-site deploy finishes.
  workflow_run:
    workflows: ["Deploy Static Site (test.idptools.com)"]
    types: [completed]
  workflow_dispatch:
  # Nightly, after the containerized "Selenium Tests" suite (10:00 UTC).
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    # Two Keycloaks, the mock STS and walt.id's issuer and verifier all have to
    # come up before ~52 browser tests run against a real site.
    timeout-minutes: 60
    # For a post-deploy (workflow_run) trigger, only run if the deploy
    # succeeded. Manual dispatch and the nightly schedule always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # remote-run-tests.sh builds the STS locally (keycloak-tests.yml) to run
          # the suite against the deployed site, and its source is the sts/
          # submodule — https://github.com/rcbj/mock-sts.git.
          # `recursive`, not `true`, and the difference is load-bearing: there
          # are now submodules INSIDE submodules. api/node-ldapjs is the LDAP
          # library the api's client uses, and sts/node-ldapjs is the same
          # library inside the mock STS, which its embedded directory is built
          # on. `true` stops one level short of the second, and an uninitialised
          # submodule is an EMPTY DIRECTORY — so the sts image builds, npm
          # installs a package with no main, and the container dies at startup
          # with `Cannot find module 'ldapjs'`, naming a package rather than a
          # submodule.
          submodules: recursive

      # The script runs run-report.js and the test scripts on the runner itself,
      # not in a container, so the runner needs the node the images use.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # xmllint is what the WS-Trust schema test validates with when the optional
      # native libxmljs2 binding is unusable. The tests image installs
      # libxml2-utils for that reason; here the suite runs on the host instead.
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      # Selenium drives the runner's own Chrome (preinstalled on ubuntu-latest)
      # and fetches a matching driver itself. Printed so that a browser-version
      # problem shows up in the log rather than as a mystery timeout.
      - name: Show tool versions
        run: |
          node --version
          docker compose version
          google-chrome --version || true

      # The script picks CONFIG_FILE from the URL (./env/test-idptools-com.js for
      # this one) and derives the SAML/API env itself, so the URL is the only
      # input. It exits non-zero when a test fails: run-report.js exits 1 and
      # check_return_code propagates it.
      - name: Run the suite against the live test site
        run: ./remote-run-tests.sh https://test.idptools.com

      # The script deliberately leaves the stack up for fast local re-runs. A
      # runner is thrown away, but tearing down keeps the log honest about what
      # was left running.
      - name: Tear down the identity stack
        if: always()
        run: sudo docker compose -p idptools-kctest -f keycloak-tests.yml down -v --remove-orphans || true

      - name: Normalize report permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" tests/report || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-test-report
          path: tests/report/latest
          if-no-files-found: warn
          retention-days: 30
