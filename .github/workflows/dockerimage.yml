name: Docker Image CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  # write is needed to push the version tags back to the repo.
  contents: write
  # and to publish the api and client images to ghcr.io (issue #154).
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
       - name: Checkout Repository
         uses: actions/checkout@v7
         with:
           # Tags are pushed from here; fetch them so an existing tag is seen.
           fetch-depth: 0
           # docker-compose.yml builds the STS image from the sts/ submodule
           # (https://github.com/rcbj/iya-sts.git), so this job cannot build
           # without it: compose would report only a missing Dockerfile.
           # `recursive`, not `true`, and the difference is load-bearing: there
           # are now submodules INSIDE submodules. api/node-ldapjs is the LDAP
           # library the api's client uses, and sts/node-ldapjs is the same
           # library inside the mock STS, which its embedded directory is built
           # on. `true` stops one level short of the second, and an
           # uninitialised submodule is an EMPTY DIRECTORY — so the sts image
           # builds, npm installs a package with no main, and the container
           # dies at startup with `Cannot find module 'ldapjs'`, naming a
           # package rather than a submodule.
           submodules: recursive
       - name: Compute version
         id: version
         run: |
           set -euo pipefail
           # One build number for this run: the same value is baked into the
           # artifact and used for the tag, so they can never disagree.
           V="$(node client/version.js --json)"
           VERSION="$(jq -r .version <<<"$V")"
           BUILD="$(jq -r .build <<<"$V")"
           MN="$(jq -r '.major + "." + .minor' <<<"$V")"
           SHA="$(git rev-parse HEAD)"
           {
             echo "version=${VERSION}"
             echo "build=${BUILD}"
             echo "major_minor=${MN}"
             echo "sha=${SHA}"
           } >> "$GITHUB_OUTPUT"
           echo "Building version ${VERSION} (build ${BUILD}) from ${SHA}"
           {
             echo "### Version \`${VERSION}\`"
             echo ""
             echo "| | |"
             echo "|---|---|"
             echo "| Version | \`${VERSION}\` |"
             echo "| Build number | \`${BUILD}\` |"
             echo "| Commit | \`${SHA}\` |"
           } >> "$GITHUB_STEP_SUMMARY"

       - name: Install docker-compose
         uses: KengoTODA/actions-setup-docker-compose@v1
         with:
           version: '5.2.0'
       - name: build
         env:
           # Bake the computed build number into the image (client/Dockerfile
           # stamps public/version.json with it at image build time).
           BUILD_NUMBER: ${{ steps.version.outputs.build }}
           GIT_COMMIT: ${{ steps.version.outputs.sha }}
         run: CONFIG_FILE=./env/local.js docker-compose -f docker-compose.yml build

       # ---------------------------------------------------------------------
       # PUBLISH THE TWO PROJECT IMAGES (issue #154), the api and the client
       # this job just built, as PUBLIC images, to TWO registries with the
       # SAME tags from the SAME build:
       #
       #   ghcr.io/rcbj/id-proto-debugger-api      docker.io/iyasec/id-proto-debugger-api
       #   ghcr.io/rcbj/id-proto-debugger-client   docker.io/iyasec/id-proto-debugger-client
       #
       # Tagged M.N.O — the SAME string as the git tag the next step puts on
       # this commit, so an image names its commit and a commit names its
       # image — and `latest`, because a master build is what a release is.
       #
       # FROM MASTER ONLY (2026-10-02). develop used to publish too, under a
       # floating `develop` tag and its own M.N.O, and that put every
       # half-finished integration on two public registries. develop and pull
       # requests still BUILD the images, so a Dockerfile that breaks is still
       # caught there; only the push waits for master. A workflow_dispatch run
       # publishes only when it is dispatched on master.
       #
       # NOT ghcr.io/rcbj/id-proto-debugger/<name>. That namespace is the
       # test stack's (tests.yml pushes it under the commit and the branch),
       # it is PRIVATE, and those images are built with the test
       # configuration; sharing a name would let one workflow overwrite the
       # other's tag.
       #
       # Never from a pull request: its GITHUB_TOKEN may not write packages and
       # its images are nobody's to keep.
       #
       # A NEW PACKAGE STARTS PRIVATE. The OCI `source` label in both
       # Dockerfiles links it to this public repository, but ghcr.io still
       # creates a first push as private, and no API can change that: make
       # each package public ONCE, under Package settings -> Danger Zone ->
       # Change visibility. Every later push keeps the setting.
       #
       # DOCKER HUB, the iyasec organization, logs in with a personal access
       # token held in two repository secrets: DOCKERHUB_USERNAME (the Docker
       # Hub account the token belongs to, which must be able to push to
       # iyasec) and DOCKERHUB_TOKEN (the token, Read & Write). A build that
       # should publish and has neither FAILS rather than publishing to one
       # registry of two, which would leave the tags disagreeing. A repository
       # a first push creates takes the organization's default visibility —
       # set iyasec's default to public, or create both repositories public
       # before the first push.
       # ---------------------------------------------------------------------
       - name: Log in to GitHub Container Registry
         if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
         run: echo "${{ secrets.GITHUB_TOKEN }}" |
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin
       - name: Log in to Docker Hub
         if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
         env:
           DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
           DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
         run: |
           set -euo pipefail
           if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
             echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must both be" \
                  "set as repository secrets to publish to docker.io/iyasec."
             exit 1
           fi
           echo "${DOCKERHUB_TOKEN}" |
             docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
       - name: Publish images
         id: publish
         if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
         env:
           VERSION: ${{ steps.version.outputs.version }}
           BRANCH: ${{ github.ref_name }}
         run: |
           set -euo pipefail
           REGISTRIES="ghcr.io/rcbj docker.io/iyasec"
           case "${BRANCH}" in
             master)  FLOAT=latest ;;
             *)       FLOAT="" ;;
           esac
           published=""
           rows=""
           for name in api client; do
             src="rcbj/${name}"
             docker image inspect "${src}" >/dev/null
             for registry in ${REGISTRIES}; do
               dst="${registry}/id-proto-debugger-${name}"
               docker tag "${src}" "${dst}:${VERSION}"
               docker push "${dst}:${VERSION}"
               published="${published} ${dst}:${VERSION}"
               if [ -n "${FLOAT}" ]; then
                 docker tag "${src}" "${dst}:${FLOAT}"
                 docker push "${dst}:${FLOAT}"
               fi
               # One RepoDigests entry per registry now, so pick this one's.
               # Docker records docker.io repositories without the host.
               repo="${dst#docker.io/}"
               digest="$(docker image inspect --format \
                   '{{range .RepoDigests}}{{println .}}{{end}}' "${src}" |
                   grep -m1 "^${repo}@" || true)"
               rows="${rows}| \`${dst}:${VERSION}\` | \`${digest#*@}\` |"$'\n'
             done
           done
           echo "images=${published# }" >> "$GITHUB_OUTPUT"
           {
             echo ""
             echo "### Published images${FLOAT:+ (also \`${FLOAT}\`)}"
             echo ""
             echo "| Image | Digest |"
             echo "|---|---|"
             printf '%s' "${rows}"
           } >> "$GITHUB_STEP_SUMMARY"

       # ARTIFACT HUB'S VERIFIED PUBLISHER BADGE. For a container-image
       # repository Artifact Hub does not read git: it looks for its
       # repository metadata file in the IMAGE repository, under the special
       # tag `artifacthub.io`, as an OCI artifact with its own media types.
       # Its repositoryID matching the one Artifact Hub assigned is the proof
       # of ownership. ghcr.io only — that is where both Artifact Hub
       # repositories point. Idempotent, so every publishing build re-pushes
       # it; the per-image metadata (readme-url and the rest) is the
       # io.artifacthub.* LABELs in each Dockerfile, not this file.
       - name: Install oras
         if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
         uses: oras-project/setup-oras@v1
       - name: Publish Artifact Hub repository metadata
         if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
         run: |
           set -euo pipefail
           for name in api client; do
             # oras takes the path as given into the layer's title, so push
             # from the file's own directory and it is named
             # artifacthub-repo.yml, as Artifact Hub expects.
             (
               cd ".github/artifacthub/${name}"
               oras push \
                 "ghcr.io/rcbj/id-proto-debugger-${name}:artifacthub.io" \
                 --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
                 artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
             )
           done

       - name: Tag this build
         if: ${{ github.event_name != 'pull_request' }}
         env:
           VERSION: ${{ steps.version.outputs.version }}
           MAJOR_MINOR: ${{ steps.version.outputs.major_minor }}
           BUILD: ${{ steps.version.outputs.build }}
           IMAGES: ${{ steps.publish.outputs.images }}
         run: |
           set -euo pipefail
           SHA="$(git rev-parse HEAD)"
           git config user.name  "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"
           # M.N.O — one per build, so it is created once and never moved.
           if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
             echo "::warning::tag ${VERSION} already exists; leaving it as it is"
           else
             # The message names the images, so the tag maps this commit to
             # them from the git side as the image tag does from the other.
             git tag -a "${VERSION}" -m "Docker Image CI build ${BUILD} from ${SHA}" \
                 -m "Images: ${IMAGES}"
             git push origin "refs/tags/${VERSION}"
             echo "Tagged ${SHA} as ${VERSION}"
           fi
           # M.N — a floating tag that always points at the newest build of this
           # line, so it is force-moved on every build.
           git tag -f -a "${MAJOR_MINOR}" -m "Latest ${MAJOR_MINOR} build: ${VERSION} (Docker Image CI)"
           git push -f origin "refs/tags/${MAJOR_MINOR}"
           echo "Moved ${MAJOR_MINOR} to ${SHA}"
           echo "Tagged \`${VERSION}\` and moved \`${MAJOR_MINOR}\` to \`${SHA}\`" >> "$GITHUB_STEP_SUMMARY"

