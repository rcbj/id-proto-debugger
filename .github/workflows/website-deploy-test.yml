name: Deploy Static Site (test.idptools.com)

# Automatic develop pipeline, chained after the Selenium Tests suite:
#
#   Selenium Tests  --(workflow_run, develop, success)-->  this workflow
#       job: terraform  -> apply the TEST infrastructure
#       job: deploy     -> build + deploy TEST content to S3/CloudFront, then tag
#                          (needs: terraform)
#
# Terraform and deploy are ORDERED JOBS in ONE workflow (not a second
# workflow_run hop). A workflow_run-triggered run is attributed to the default
# branch, so chaining terraform -> deploy across separate workflows loses the
# develop branch/SHA. Chaining a single hop from Selenium Tests keeps it: both
# jobs check out the exact develop commit the suite tested
# (github.event.workflow_run.head_sha).
#
# The Selenium Tests suite runs once (in its own workflow) and gates this one.
#
# NOTE: workflow_run triggers only fire from the workflow file on the DEFAULT
# branch (master) — keep this file updated there.

on:
  # Run after the Selenium Tests suite completes for a develop push.
  workflow_run:
    workflows: ["Selenium Tests"]
    types: [completed]
    branches: [develop]
  # Manual full run (apply TEST infra + deploy).
  workflow_dispatch:

permissions:
  # write is needed to push the deploy tag back to the repo.
  contents: write

jobs:
  # ---- Apply the TEST infrastructure first ----
  terraform:
    runs-on: ubuntu-latest
    # For a workflow_run trigger, only proceed if the suite succeeded on develop.
    # Manual dispatch always proceeds.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'develop') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # The exact commit the suite tested (workflow_run) or the dispatch ref.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Build terraform image
        run: docker build -t idptools-terraform -f infra/Dockerfile .

      - name: Terraform apply (test)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION=us-west-2 \
            -e TF_ENV=test \
            -e TF_ACTION=apply \
            idptools-terraform

  # ---- Then build + deploy the static content (only if terraform succeeded) ----
  deploy:
    needs: terraform
    runs-on: ubuntu-latest
    # For a workflow_run trigger, only deploy if Terraform succeeded on develop.
    # Manual dispatch always proceeds.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'develop') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          # Tags are pushed from here; fetch them so an existing tag is seen.
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          # One build number for this run: the same value is baked into the
          # artifact and used for the tag, so they can never disagree.
          V="$(node client/version.js --json)"
          VERSION="$(jq -r .version <<<"$V")"
          BUILD="$(jq -r .build <<<"$V")"
          MN="$(jq -r '.major + "." + .minor' <<<"$V")"
          SHA="$(git rev-parse HEAD)"
          {
            echo "version=${VERSION}"
            echo "build=${BUILD}"
            echo "major_minor=${MN}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} (build ${BUILD}) from ${SHA}"
          {
            echo "### Version \`${VERSION}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Build number | \`${BUILD}\` |"
            echo "| Commit | \`${SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build deploy image
        run: docker build -t idptools-static-deploy -f deploy/Dockerfile .

      - name: Build static content and deploy TEST to S3 + CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # The build number computed above, so the deployed site and the tag
          # report the same M.N.O.
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          GIT_COMMIT: ${{ steps.version.outputs.sha }}
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION=us-west-2 \
            -e DEPLOY_ENV=test \
            -e BUILD_NUMBER \
            -e GIT_COMMIT \
            idptools-static-deploy

      # Tag the exact commit that was built/deployed, only after a successful
      # deploy. Tag format: TEST_IDPTOOLS_MMDDYYYYHHMMSS (UTC):
      #   MM=month DD=day YYYY=year HH=24h-hour MM=minute SS=second.
      - name: Tag deployed commit
        run: |
          set -euo pipefail
          TS="$(date -u +%m%d%Y%H%M%S)"
          TAG="TEST_IDPTOOLS_${TS}"
          SHA="$(git rev-parse HEAD)"
          echo "Tagging ${SHA} as ${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Deployed test.idptools.com from ${SHA} at ${TS} UTC"
          git push origin "${TAG}"

      # Version tags for the same commit: the immutable M.N.O of this build and
      # the floating M.N pointing at the newest build of the line.
      - name: Tag this build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR_MINOR: ${{ steps.version.outputs.major_minor }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # M.N.O — one per build, so it is created once and never moved.
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::warning::tag ${VERSION} already exists; leaving it as it is"
          else
            git tag -a "${VERSION}" -m "Deployed test.idptools.com build ${BUILD} from ${SHA}"
            git push origin "refs/tags/${VERSION}"
            echo "Tagged ${SHA} as ${VERSION}"
          fi
          # M.N — a floating tag that always points at the newest build of this
          # line, so it is force-moved on every build.
          git tag -f -a "${MAJOR_MINOR}" -m "Latest ${MAJOR_MINOR} build: ${VERSION} (Deployed test.idptools.com)"
          git push -f origin "refs/tags/${MAJOR_MINOR}"
          echo "Moved ${MAJOR_MINOR} to ${SHA}"
          echo "Tagged \`${VERSION}\` and moved \`${MAJOR_MINOR}\` to \`${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
