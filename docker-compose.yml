version: '3'
# ---------------------------------------------------------------------------
# EVERY IMAGE THIS FILE PULLS, AND EVERY BASE IMAGE IT BUILDS FROM, COMES
# FROM THE PRIVATE ghcr.io MIRROR — the same arrangement as
# docker-compose-run-tests.yml, whose header explains it. `image:` names the
# mirror directly; a Dockerfile's FROM is redirected by the build's
# `additional_contexts`, which is this anchor. Pulls need
# `docker login ghcr.io` with a token that can read packages.
# tests/image_mirror_coverage.js holds this file to it.
# ---------------------------------------------------------------------------
x-mirror-contexts: &mirror-contexts
  ubuntu: docker-image://${IMAGE_MIRROR:-ghcr.io/rcbj/id-proto-debugger/mirror}/ubuntu:latest
  "node:24.22.1-bookworm-slim": docker-image://${IMAGE_MIRROR:-ghcr.io/rcbj/id-proto-debugger/mirror}/node:24.22.1-bookworm-slim
  "eclipse-temurin:11-jdk": docker-image://${IMAGE_MIRROR:-ghcr.io/rcbj/id-proto-debugger/mirror}/eclipse-temurin:11-jdk
services:
  api:
    container_name: api
    image: rcbj/api
    environment:
      - CONFIG_FILE=./env/local.js
      - TLS_ENABLED=true
      - TLS_CERT_FILE=/etc/idptools/tls/stack-tls-cert.pem
      - TLS_KEY_FILE=/etc/idptools/tls/stack-tls-key.pem
    # ---------------------------------------------------------------------
    # THE STACK'S TLS PAIR.
    #
    # `client/src/env/local.js` and `api/env/local.js` both set `https: true`,
    # so these two services serve TLS and need a certificate. THIS compose
    # file has no launcher in front of it — the repo-root CLAUDE.md documents
    # `CONFIG_FILE=./env/local.js docker-compose up` as a bare command — so
    # generate the pair once, first:
    #
    #     ./generate-tls-cert.sh
    #
    # It writes ./generated-tls, which is what this mounts and what
    # .gitignore already covers. Without it compose creates that path as an
    # EMPTY directory and both services exit at startup naming the file they
    # could not read — the same shape as the walt.id `generated-*-config`
    # hazard this repository already records, and the message names the
    # generator.
    # ---------------------------------------------------------------------
    volumes:
      - ${STACK_TLS_DIR:-./generated-tls}:/etc/idptools/tls:ro
    build:
      context: .
      additional_contexts: *mirror-contexts
      dockerfile: ./api/Dockerfile
      args:
        CONFIG_FILE: ${CONFIG_FILE}
        # Optional: CI fixes the build number so the image and the git tag agree.
        # Unset locally -> version.js falls back to the UTC build instant.
        BUILD_NUMBER: ${BUILD_NUMBER:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    ports:
      - "4000:4000"
  client:
    container_name: client
    image: rcbj/client
    environment:
      - CONFIG_FILE=./env/local.js
      - TLS_ENABLED=true
      - TLS_CERT_FILE=/etc/idptools/tls/stack-tls-cert.pem
      - TLS_KEY_FILE=/etc/idptools/tls/stack-tls-key.pem
    # ---------------------------------------------------------------------
    # THE STACK'S TLS PAIR.
    #
    # `client/src/env/local.js` and `api/env/local.js` both set `https: true`,
    # so these two services serve TLS and need a certificate. THIS compose
    # file has no launcher in front of it — the repo-root CLAUDE.md documents
    # `CONFIG_FILE=./env/local.js docker-compose up` as a bare command — so
    # generate the pair once, first:
    #
    #     ./generate-tls-cert.sh
    #
    # It writes ./generated-tls, which is what this mounts and what
    # .gitignore already covers. Without it compose creates that path as an
    # EMPTY directory and both services exit at startup naming the file they
    # could not read — the same shape as the walt.id `generated-*-config`
    # hazard this repository already records, and the message names the
    # generator.
    # ---------------------------------------------------------------------
    volumes:
      - ${STACK_TLS_DIR:-./generated-tls}:/etc/idptools/tls:ro
    build:
      context: .
      additional_contexts: *mirror-contexts
      dockerfile: ./client/Dockerfile
      args:
        CONFIG_FILE: ${CONFIG_FILE}
        # Optional: CI fixes the build number so the image and the git tag agree.
        # Unset locally -> version.js falls back to the UTC build instant.
        BUILD_NUMBER: ${BUILD_NUMBER:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    ports:
      - "3000:3000"
  sts:
    environment:
      # Log level, chosen the same way as for api and client.
      - CONFIG_FILE=./env/local.js
      # THE ADDRESS THE MOCK HANDS THE END-USER BACK TO, and it has to be set
      # here now rather than left to that service's default. iya-sts's own
      # `oid4vci.walletUrl` defaults to `http://localhost:3000`, which was
      # this client's address until it started serving TLS; left alone, a
      # Credential Offer would send the End-User to an http origin nothing is
      # listening on. iya-sts is somebody else's release, so the fix
      # belongs on this side. `oid4vp.walletUrl` is DERIVED from this one (see
      # sts/common/config.js), so the verifier's hand-back follows.
      - OID4VCI_WALLET_URL=https://localhost:3000
      # iya-sts appends no page to the wallet URL since #594: a web
      # wallet whose pages are not its root names them. These are the
      # debugger's own two.
      - OID4VCI_WALLET_ISSUANCE_PATH=/vc-issuance-1.html
      - OID4VP_WALLET_PRESENTATION_PATH=/vc-presentation-1.html
      # The debugger's origin, which the mock's CORS allowlist has had to be
      # told since iya-sts 2f9825f (2026-09-13) — before it every response
      # carried `Access-Control-Allow-Origin: *`. Without it every call a page
      # makes to this service from the browser (discovery, JWKS, SSF, SCIM,
      # the credential issuer) fails as "Failed to fetch". See the note on the
      # same line in docker-compose-run-tests.yml.
      - STS_CORS_ORIGINS=https://localhost:3000
      # ---------------------------------------------------------------------
      # THE SAME LEAF THE API AND THE CLIENT SERVE, WHICH IS ONE TRUST
      # DECISION INSTEAD OF THREE.
      #
      # Left alone this service issues its own self-signed certificate at
      # every start and publishes it from GET /tls/server-certificate for a
      # caller to trust. That works and it costs a SECOND anchor, on a THIRD
      # origin, replaced on every restart. ./generate-tls-cert.sh now issues
      # the stack's leaf from a Root CA that outlives it, and the leaf's
      # subjectAltNames already carry this service's own tls.hostnames
      # defaults (sts, sts-mock, sts.example.com) beside localhost, client and
      # api — so handing it the same files makes ONE trusted root cover the
      # UI, the api and the mock at once.
      #
      # It covers every one of this process's TLS sockets, because they share
      # one pair: 8081 (the main port under global.https), the directory's
      # LDAPS listener on 636, and the embedded debugger's listener. It was
      # four sockets until 2026-09-16, the other two being that service's own
      # TLS listeners on 8443 and 9443, which were deleted.
      # ---------------------------------------------------------------------
      - STS_TLS_CERT_FILE=/etc/idptools/tls/stack-tls-cert.pem
      - STS_TLS_KEY_FILE=/etc/idptools/tls/stack-tls-key.pem
      # ---------------------------------------------------------------------
      # THE MANAGEMENT API'S CLIENT SECRET, PINNED FOR THIS RUN.
      #
      # `/admin-api` takes an OAuth 2.0 access token since the 2026-09-09
      # submodule bump, minted by the seeded `sts-api-client` (`sts-management-api` until #1139) with
      # client_credentials. That client's secret is generated at every start
      # of this service and is readable only THROUGH the API it unlocks — a
      # bootstrap hole — so `adminApi.clientSecret` exists to pin it.
      # common/common.sh generates one per launcher run and forwards it; a
      # bare `docker-compose up` leaves it empty, which is this service's own
      # default and means a `/admin-api` nothing here can reach. Set it, or
      # set ADMIN_API_AUTH_REQUIRED=false, if you want in from a shell.
      # ---------------------------------------------------------------------
      - ADMIN_API_CLIENT_SECRET=${ADMIN_API_CLIENT_SECRET:-}
    volumes:
      - ${STACK_TLS_DIR:-./generated-tls}:/etc/idptools/tls:ro
    # NOT `sts`: the iya-sts repository's own docker-compose.yml names its
    # container `sts` too, a container name is machine-wide, and whichever
    # stack started second could not create its mock. The SERVICE (and so
    # the DNS name every URL here uses) is still `sts`.
    container_name: id-proto-debugger-sts
    # iya-sts's RELEASE IMAGE, pulled rather than built — the same one
    # docker-compose-run-tests.yml runs, where the release is named
    # (IYA_STS_IMAGE; tests/image_mirror_coverage.js holds this default to
    # that one). This repository has no iya-sts checkout to build from.
    image: ${IYA_STS_IMAGE:-${IMAGE_MIRROR:-ghcr.io/rcbj/id-proto-debugger/mirror}/iya-sts:1.0.0}
    # The image runs as uid 10001 and binds 88 (TCP and UDP), 389 and 636,
    # all privileged. The sysctl is per network namespace, so it lowers the
    # bar inside this container alone; docker-compose-run-tests.yml does the
    # same and says more.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "8081:8081"
      # 8443 AND 9443 WERE PUBLISHED HERE UNTIL 2026-09-17, and both lines are
      # gone because the sockets are. They were the mock's own TLS listeners —
      # 8443 asked for a client certificate and never refused one, 9443
      # required it — and that service deleted both on 2026-09-16: the main
      # port already had 8443's posture, and refusing at the handshake is a
      # property of a socket that cannot be had on a port every other protocol
      # answers on. The PKI page's TLS pane points at 8081 now, through the
      # api, since a browser cannot present a certificate it just issued.
      # Publishing a port nothing binds costs nothing and explains nothing,
      # which is the whole reason to take the lines out. Both are still in
      # api/tls_probe.js's default port allowlist, which is a list of ports a
      # caller MAY name and not a list of ports anything here listens on.
      #
      # The two SPIFFE gRPC surfaces. Published because a tool run on the
      # host — including an api started outside compose — cannot reach a
      # port that only exists on the bridge. The api container beside this
      # one reaches them as sts:8092 and sts:8181 and
      # needs neither line. They are 8092 and 8181 rather than SPIRE's own
      # 8081 because this service's HTTP port already has that.
      - "8092:8092"
      - "8181:8181"
