# Merged into conf/idp.properties by the installer (idp.merge.properties).
# Everything not named here is the 4.3.3 default.
idp.entityID=http://shibboleth-idp:8080/idp/shibboleth
idp.scope=example.test
# Only the Password flow, backed by credentials/demo.htpasswd (see
# conf/authn/password-authn-config.xml).
idp.authn.flows=Password
# The stack talks to this IdP over plain HTTP on the compose network, so
# its own cookies must not be marked Secure or a browser would drop them.
idp.cookie.secure=false
